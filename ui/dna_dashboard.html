  @media(max-width:980px){.dna-workspace,.dna-middle,.dna-lower-grid{grid-template-columns:1fr}.dna-portfolio{grid-template-columns:1fr}.dna-portfolio-slice+.dna-portfolio-slice{border-left:0;border-top:1px solid #97d8b0}.dna-decision{height:auto;grid-template-columns:1fr 1fr}.dna-radar{grid-template-columns:repeat(2,1fr)}.paper-command-body{grid-template-columns:1fr}.paper-progress{border-right:0;border-bottom:1px solid var(--line)}.paper-kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.dna-decision{grid-template-columns:1fr}.dna-slice-metrics{grid-template-columns:1fr 1fr}.dna-radar{grid-template-columns:1fr}.dna-progression,.dna-watch-grid{grid-template-columns:1fr}.dna-insight-row{grid-template-columns:1fr}.paper-command-head{align-items:flex-start;flex-direction:column}.paper-head-actions{width:100%}.paper-head-actions button{flex:1}.paper-kpis,.paper-daily-grid{grid-template-columns:1fr 1fr}.paper-track-labels{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">🧬</div>
      <div>
        <h1>DNA Dashboard</h1>
        <div class="subtitle">What needs you, what you're holding, and what the campaign is doing — in that order.</div>
      </div>
    </div>
    <div class="conn">
      <input data-role="base" type="text" placeholder="API base URL">
      <input data-role="token" type="password" placeholder="Token">
      <button data-role="load">Load</button>
      <button data-role="theme-toggle" title="Switch light/dark">◐</button>
      <span class="status" data-role="status"></span>
    </div>
  </div>
</header>

<main>
  <div id="app"><div class="msg">Connecting…</div></div>
</main>

<script src="vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var baseInput = $('[data-role="base"]'), tokenInput = $('[data-role="token"]');
  var statusEl = $('[data-role="status"]'), app = $("#app");

  baseInput.value = localStorage.getItem("dna_api_base") || "https://dna-tradingview-webhook-production.up.railway.app";
  tokenInput.value = localStorage.getItem("dna_api_token") || "";

  // Theme toggle -- CSS already has explicit [data-theme] overrides, this
  // just flips between them instead of always trailing the OS setting.
  var themeBtn = $('[data-role="theme-toggle"]');
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = t === "light" ? "☀" : t === "dark" ? "☾" : "◐";
  }
  applyTheme(localStorage.getItem("dna_theme") || "");
  themeBtn.addEventListener("click", function () {
    var cur = localStorage.getItem("dna_theme") || "";
    var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var order = sysDark ? ["", "light", "dark"] : ["", "dark", "light"];
    var next = order[(order.indexOf(cur) + 1) % order.length];
    localStorage.setItem("dna_theme", next);
    applyTheme(next);
  });

  function authHeaders() {
    var t = tokenInput.value.trim();
    return t ? { Authorization: "Bearer " + t } : {};
  }

  // --- Timeframe tiers, straight from Coordinator_Spec_v1.md -------------
  // The whole point of the tier system is that a 5m reading must never carry
  // the same visual weight as a 4H one. Grouping here is what stops the
  // shortest timeframe from dominating the page.
  var TIERS = [
    { key: "backbone",  tfs: ["D", "W"],     label: "Direction" },
    { key: "owner",     tfs: ["180", "240"], label: "Campaign" },
    { key: "confirm",   tfs: ["60", "120"],  label: "Confirmation" },
    { key: "timing",    tfs: ["15", "30"],   label: "Timing" },
    { key: "micro",     tfs: ["3", "5"],     label: "Right now" }
  ];
  function tierOf(tf) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].tfs.indexOf(String(tf)) !== -1) return TIERS[i];
    return null;
  }
  var TF_SORT = { "3":0,"5":1,"15":2,"30":3,"60":4,"120":5,"180":6,"240":7,"D":8,"W":9 };
  // Pine's timeframe.period emits "1D"/"1W" for daily/weekly, but this
  // dashboard keys everything off "D"/"W". Normalize once so Daily isn't
  // silently dropped from the tier model, the chart, and the TF toggles.
  function canonTf(tf) {
    tf = String(tf);
    if (tf === "1D" || tf === "1d") return "D";
    if (tf === "1W" || tf === "1w") return "W";
    return tf;
  }
  function tfKey(tf){ tf = canonTf(tf); return TF_SORT.hasOwnProperty(tf) ? TF_SORT[tf] : 99; }
  function tfLabel(tf) {
    tf = canonTf(String(tf));
    if (tf === "D") return "Daily";
    if (tf === "W") return "Weekly";
    var n = parseInt(tf, 10);
    if (isNaN(n)) return tf;
    return n >= 60 ? (n / 60) + "H" : n + "m";
  }

  // --- Phase vocabulary -> plain language -------------------------------
  var BROKEN   = ["FAILED","FAIL","MODERATE FAIL","STRONG FAIL","CATASTROPHIC FAIL"];
  var STRESSED = ["FAIL TEST"];
  var STRETCH  = ["PREMIUM","PEAK","MANAGE"];
  var BUILDING = ["EXPANSION","IGNITION","STRONG START","CAMPAIGN START","FIRE ADD","ADD","RELOAD","ACCUMULATE","ACCUMULATION"];
  var PLAIN = {
    "EXPANSION":"expanding","IGNITION":"igniting","STRONG START":"campaign started",
    "CAMPAIGN START":"campaign started","FIRE ADD":"adding hard","ADD":"adding",
    "ACCUMULATION":"accumulating","ACCUMULATE":"accumulating","RELOAD":"recovered",
    "MANAGE":"overextended","PEAK":"peaking","PREMIUM":"stretched",
    "FAIL TEST":"under stress","FAILED":"broken down","FAIL":"broken down",
    "MODERATE FAIL":"broken down","STRONG FAIL":"broken down badly",
    "CATASTROPHIC FAIL":"broken down badly","WAIT":"quiet","RESOLVING":"resolving",
    "RECOVERY WATCH":"trying to recover","START TEST":"testing","IGNITION TEST":"testing"
  };
  // WAIT is Pine's per-bar default -- campaignPhase is recomputed fresh
  // every bar and only overwritten if THAT bar hits a specific condition
  // (an event, or continuationContext: close>ema50 AND ema21>ema50 AND
  // ema21Slope>0 AND low>recentLow, all four, on that one bar). Miss any
  // one of those on a single bar and phase falls through to WAIT even
  // though campaignHealth -- smoothed and persistent, not per-bar -- can
  // still be high. So "WAIT" means "nothing specific classified this bar,"
  // not "campaign inactive." Reading it as flatly "quiet" regardless of
  // health was the actual bug; this reflects health in the wording instead.
  var WAIT_STEADY_HEALTH = 70;
  function plain(p, health) {
    var up = (p || "").toUpperCase();
    if (up === "WAIT" && health != null && health >= WAIT_STEADY_HEALTH) return "holding steady";
    return PLAIN[up] || (p || "no reading").toLowerCase();
  }
  function phaseTone(p) {
    p = (p || "").toUpperCase();
    if (BROKEN.indexOf(p) !== -1) return "neg";
    if (STRESSED.indexOf(p) !== -1) return "neg";
    if (STRETCH.indexOf(p) !== -1) return "warn";
    if (BUILDING.indexOf(p) !== -1) return "pos";
    return "neu";
  }

  function age(raw) {
    if (!raw) return { text: "—", stale: true, mins: Infinity };
    var d = /^\d+$/.test(String(raw).trim())
      ? new Date(Number(raw))
      : new Date(String(raw).replace(" ", "T") + (String(raw).endsWith("Z") ? "" : "Z"));
    if (isNaN(d.getTime())) return { text: String(raw), stale: false, mins: 0 };
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    return {
      mins: m, stale: m > 24 * 60,
      text: m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"
    };
  }

  // --- Tier reading: the worst/most significant signal in the tier wins --
  function readTier(states, tier) {
    var rows = states.filter(function (s) { return tier.tfs.indexOf(String(s.timeframe)) !== -1; });
    if (!rows.length) return { tier: tier, rows: [], tone: "none", text: "no data", empty: true };
    var rank = { neg: 3, warn: 2, pos: 1, neu: 0 };
    var best = rows[0], bestRank = -1;
    rows.forEach(function (r) {
      var t = rank[phaseTone(r.phase)];
      if (t > bestRank) { bestRank = t; best = r; }
    });
    return { tier: tier, rows: rows, tone: phaseTone(best.phase), text: plain(best.phase, best.health), lead: best, empty: false };
  }

  // --- Attention triage: one honest, rule-based verdict per asset -------
  function assess(states) {
    var t = {};
    TIERS.forEach(function (tier) { t[tier.key] = readTier(states, tier); });

    var newest = Infinity;
    states.forEach(function (s) { var a = age(s.bar_time); if (a.mins < newest) newest = a.mins; });
    var allStale = newest > 24 * 60;

    var upper = [t.backbone, t.owner, t.confirm];
    var brokenUpper = upper.filter(function (x) { return x.tone === "neg"; });
    var stretched = TIERS.map(function (x) { return t[x.key]; }).filter(function (x) { return x.tone === "warn"; });
    var buildingLower = [t.confirm, t.timing].filter(function (x) { return x.tone === "pos"; });

    var level, headline, why;
    if (brokenUpper.length) {
      level = "critical";
      headline = "needs a decision";
      why = brokenUpper[0].tier.label.toLowerCase() + " has " + brokenUpper[0].text;
    } else if (stretched.length) {
      level = "watch";
      headline = "worth watching";
      why = stretched[0].tier.label.toLowerCase() + " is " + stretched[0].text;
    } else if (buildingLower.length && t.owner.tone !== "neg") {
      level = "opportunity";
      headline = "setting up";
      why = buildingLower[0].tier.label.toLowerCase() + " is " + buildingLower[0].text;
    } else {
      level = "quiet";
      headline = "nothing to do";
      why = t.owner.empty ? "no campaign-level data yet" : "campaign is " + t.owner.text;
    }
    if (allStale) why = "nothing new in " + (newest > 2880 ? Math.round(newest / 1440) + " days" : Math.round(newest / 60) + " hours");

    return { tiers: t, level: level, headline: headline, why: why, allStale: allStale, newest: newest, warmup: warmingUp(t) };
  }

  var LEVEL_ORDER = { critical: 0, watch: 1, opportunity: 2, quiet: 3 };

  // --- Warming up: campaign already constructive, confirmation hasn't
  // caught up yet, and a fresh entry-type signal just fired on timing/
  // micro. This is the state *before* "campaign and confirmation agree"
  // (which requires confirmation to already be pos) -- an earlier, looser
  // flag, not a score. Deliberately discrete (a real signal_event fired,
  // recently) rather than a synthesized number, so it can't imply more
  // precision than the underlying reads actually have.
  var WARMUP_SIGNALS = ["STRONG START", "RELOAD", "ADD", "CAMPAIGN START", "FIRE ADD", "ACCUMULATE"];
  function warmingUp(t) {
    if (t.owner.empty || t.owner.tone !== "pos") return null;
    if (t.confirm.tone === "pos" || t.confirm.tone === "neg") return null;
    var lowerRows = (t.timing.rows || []).concat(t.micro.rows || []);
    var fresh = lowerRows.filter(function (r) {
      return WARMUP_SIGNALS.indexOf(String(r.signal_event || "").toUpperCase()) !== -1 && !age(r.bar_time).stale;
    });
    if (!fresh.length) return null;
    fresh.sort(function (x, y) { return tfKey(x.timeframe) - tfKey(y.timeframe); });
    return { row: fresh[0], ownerText: t.owner.text, ownerTf: t.owner.lead.timeframe };
  }

  // --- Actions: only what's actionable now, never a running commentary --
  function actionsFor(sym, a) {
    var out = [], t = a.tiers;

    // Reload-quality context, computed up front so critical cards can fold
    // it in directly instead of leaving "this is a recovery that failed"
    // stranded in a separate card the reader might not connect to the
    // breakdown they're already looking at.
    var messyByTf = {};
    Object.keys(t).forEach(function (k) {
      (t[k].rows || []).forEach(function (r) { if (r.reload_quality === "MESSY") messyByTf[String(r.timeframe)] = r; });
    });
    var mergedTfs = {};
    function messyNote(tf) {
      return " This follows a recovery attempt on " + tfLabel(tf) + " that didn't hold — not a fresh, unrelated breakdown.";
    }

    if (t.backbone.tone === "neg" || t.owner.tone === "neg") {
      var leadRow = t.owner.tone === "neg" ? t.owner.lead : t.backbone.lead;
      var leadText = t.owner.tone === "neg" ? t.owner.text : t.backbone.text;
      var leadTf = leadRow ? String(leadRow.timeframe) : null;
      var isMessy = leadTf && messyByTf[leadTf];
      if (isMessy) mergedTfs[leadTf] = true;
      out.push({ level: "critical", ic: "✕", title: isMessy ? "Protect, don't add — recovery didn't hold" : "Protect, don't add",
        text: "The campaign structure itself is " + leadText + " on " + sym + ". Adding into this is fighting the higher timeframe." + (isMessy ? messyNote(leadTf) : ""),
        why: leadTf ? "from " + tfLabel(leadTf) : "" });
    } else if (t.confirm.tone === "neg") {
      var confirmTf = String(t.confirm.lead.timeframe);
      var confirmMessy = messyByTf[confirmTf];
      if (confirmMessy) mergedTfs[confirmTf] = true;
      out.push({ level: "critical", ic: "!", title: confirmMessy ? "Confirmation broke — recovery didn't hold" : "Confirmation broke",
        text: "The confirmation timeframes turned " + t.confirm.text + " while the campaign above is still intact. This is where a position gets challenged — worth a look before it propagates up." + (confirmMessy ? messyNote(confirmTf) : ""),
        why: "from " + tfLabel(confirmTf) });
    }

    TIERS.forEach(function (tier) {
      var r = t[tier.key];
      if (r.tone === "warn" && !r.empty) {
        out.push({ level: "watch", ic: "⚠", title: "Stretched on " + tfLabel(r.lead.timeframe),
          text: sym + " is reading " + r.text + " here — an early pause warning, not an exit signal. If you're holding, this is a manage-and-watch moment.",
          why: "phase " + r.lead.phase });
      }
    });

    if (t.owner.tone === "pos" && t.confirm.tone === "pos") {
      out.push({ level: "opportunity", ic: "▲", title: "Campaign and confirmation agree",
        text: "Both the campaign timeframes and the confirmation timeframes are constructive on " + sym + " — the cleanest version of a setup this engine produces.",
        why: tfLabel(t.owner.lead.timeframe) + " + " + tfLabel(t.confirm.lead.timeframe) });
    } else if (t.timing.tone === "pos" && t.owner.tone !== "neg" && t.confirm.tone !== "pos") {
      out.push({ level: "watch", ic: "◷", title: "Timing is early",
        text: "The timing timeframes are moving on " + sym + " but confirmation hasn't caught up. Real, but unproven at the level that decides whether it holds.",
        why: "unconfirmed by " + TIERS[2].tfs.map(tfLabel).join("/") });
    }

    // Only surface remaining messy-reload timeframes that weren't already
    // folded into a critical card above -- avoids saying the same thing twice.
    var leftoverMessy = Object.keys(messyByTf).filter(function (tf) { return !mergedTfs[tf]; });
    if (leftoverMessy.length) {
      var mr = messyByTf[leftoverMessy[0]];
      out.push({ level: "watch", ic: "↺", title: "Last recovery didn't hold",
        text: "A failure followed the last recovery on " + tfLabel(mr.timeframe) + " within the tracking window. Treat the recovery as unsettled rather than done.",
        why: "reload quality: messy" });
    }

    if (a.allStale) {
      out.push({ level: "watch", ic: "◴", title: "This data is stale",
        text: "Nothing has come in for " + sym + " in over a day. That could be a genuinely quiet campaign or a webhook that stopped — silence alone can't tell you which.",
        why: "newest reading " + Math.round(a.newest / 60) + "h old" });
    }
    return out;
  }

  // --- Render -----------------------------------------------------------
  var assets = [], cache = {}, selected = null;
  var portfolio = [], realized = 0, portfolioById = {};
  var newsBySymbol = {}, marketWatchBySymbol = {}, filingsBySymbol = {};
  var paperChallenge = { health: null, experiment: null, proposals: [], reports: [], error: null, loading: false, seq: 0 };
  var paperCountdownTimer = null;
  var paperExperimentId = Number(localStorage.getItem("dna_paper_experiment_id") || 1);
  // Which single holding (share line or option contract) the chart + insight
  // panel currently track. null = nothing picked yet. Keyed by leg_ids so it
  // survives a repaint even though holding objects themselves get rebuilt.
  var selectedHolding = null;
  function holdingKey(legIds) { return (legIds || []).join(","); }
  // Manual chart-timeframe pick per symbol (keyed by OHLC label, e.g. "1H").
  // Empty/absent means "auto" -- drawChart widens on its own to fit the
  // selected holding's entry instead of always opening on the shortest bar.
  var chartTfOverride = {};
  function parseIsoMs(iso) {
    if (iso == null) return null;
    var t = new Date(String(iso).replace(" ", "T") + (String(iso).endsWith("Z") ? "" : "Z")).getTime();
    return isNaN(t) ? null : t;
  }

  function realizedPnl(p) {
    var sum = 0;
    (p.instruments || []).forEach(function (i) {
      if (i.exit_price != null && i.entry_price != null) {
        var mult = i.instrument_type === "SHARE" ? 1 : 100;
        sum += (i.exit_price - i.entry_price) * i.quantity * mult;
      }
    });
    return sum;
  }

  function loadClosedPositions() {
    var base = baseInput.value.trim().replace(/\/$/, "");
    return fetch(base + "/positions?status=CLOSED", { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : { positions: [] }; })
      .catch(function () { return { positions: [] }; })
      .then(function (d) {
        var summaries = d.positions || [];
        return Promise.all(summaries.map(function (p) {
          return fetch(base + "/positions/" + p.id, { headers: authHeaders() })
            .then(function (r) { return r.ok ? r.json() : p; })
            .catch(function () { return p; });
        }));
      })
      .then(function (details) {
        realized = details.reduce(function (acc, p) { return acc + realizedPnl(p); }, 0);
      });
  }

  function loadPortfolio() {
    var base = baseInput.value.trim().replace(/\/$/, "");
    return fetch(base + "/positions?status=OPEN", { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : { positions: [] }; })
      .catch(function () { return { positions: [] }; })
      .then(function (d) {
        var summaries = d.positions || [];
        return Promise.all(summaries.map(function (p) {
          return fetch(base + "/positions/" + p.id + "/valuation", { headers: authHeaders() })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (v) { return { summary: p, valuation: v }; });
        }));
      })
      .then(function (list) {
        portfolio = list;
        portfolioById = {};
        list.forEach(function (p) { portfolioById[p.summary.id] = p.valuation; });
      });
  }

  function fmtExpiry(iso) {
    if (!iso) return "";
    var d = new Date(String(iso).replace(" ", "T") + "Z");
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }).toUpperCase();
  }

  function contractLabels(v) {
    if (!v) return "…";
    var parts = [];
    (v.options || []).forEach(function (o) {
      parts.push("$" + o.contract.strike + " " + o.contract.type + " " + fmtExpiry(o.contract.expiration));
    });
    if (v.stock && v.stock.shares) parts.push(v.stock.shares + " shares");
    return parts.join(" · ");
  }

  function deriveHoldings() {
    var shares = [], strategies = [];
    portfolio.forEach(function (p) {
      var v = p.valuation;
      if (!v) return;
      var base = { symbol: p.summary.symbol, direction: p.summary.direction, position_id: p.summary.id };
      if (v.stock && v.stock.shares) shares.push(Object.assign({}, v.stock, base));
      (v.options || []).forEach(function (o) { strategies.push(Object.assign({}, o, base)); });
    });
    return { shares: shares, strategies: strategies };
  }

  function statCard2(label, value) {
    return '<div class="pos-stat acc2"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value tabular">' + value + '</div></div>';
  }

  function renderStockDetail(s) {
    return '<div class="pos-opt-detail">' +
      '<span><b>avg cost</b> ' + fmtMoney(s.avg_cost) + '</span>' +
      '<span><b>current</b> ' + fmtMoney(s.current_price) + '</span>' +
      '<span><b>market value</b> ' + fmtMoney(s.market_value) + '</span>' +
      '<span><b>bought</b> ' + fmtDate(s.first_entry) + '</span>' +
      '<span><b>today</b> ' + fmtSigned(s.today_pnl) + ' (' + fmtPct(s.today_return_pct) + ')</span>' +
      '<span><b>total</b> ' + fmtSigned(s.total_pnl) + ' (' + fmtPct(s.total_return_pct) + ')</span>' +
      '</div>';
  }

  function renderSharesSection(shares) {
    if (!shares.length) return "";
    var totalShares = 0, value = 0, today = 0, total = 0;
    shares.forEach(function (s) {
      totalShares += s.shares; value += s.market_value || 0; today += s.today_pnl || 0; total += s.total_pnl || 0;
    });
    var rows = shares.map(function (s) {
      var pnl = s.total_pnl;
      var detail = renderStockDetail(s) +
        '<div class="pf-actions">' +
          '<button class="pf-close" data-pid="' + s.position_id + '" data-legs="' + JSON.stringify(s.leg_ids) + '" data-label="' + s.symbol + ' shares">Close shares…</button>' +
          '<button class="pf-del" data-pid="' + s.position_id + '" data-legs="' + JSON.stringify(s.leg_ids) + '" data-label="' + s.symbol + ' shares">✕</button>' +
        '</div>';
      var key = holdingKey(s.leg_ids);
      return '<div class="pf-item">' +
        '<div class="pf-row' + (key === selectedHolding ? " selected" : "") + '" data-holding="' + key + '"><span class="pf-label">' + s.symbol + ' ' + s.direction + ' — ' + s.shares + ' shares</span>' +
        '<span class="pf-val tabular">' + fmtMoney(s.market_value) + '</span>' +
        '<span class="pf-pnl tabular ' + (pnl == null ? "" : (pnl >= 0 ? "pos" : "neg")) + '">' + fmtSigned(pnl) + '</span>' +
        '</div><div class="pf-detail" style="display:none">' + detail + '</div></div>';
    }).join("");
    return '<div class="pf-section shares">' +
      '<div class="stage-head"><h2>Shares</h2><span class="hint">may stay open — exit per holding</span></div>' +
      '<div class="pf-summary">' +
        statCard2("Shares", totalShares) +
        statCard2("Value", fmtMoney(value)) +
        statCard2("Today", fmtSigned(today)) +
        statCard2("Total return", fmtSigned(total)) +
      '</div>' +
      '<div class="pf-rows">' + rows + '</div></div>';
  }

  function renderOptionsSection(strategies) {
    if (!strategies.length) return "";
    var totalContracts = 0, value = 0, today = 0, total = 0;
    strategies.forEach(function (o) {
      totalContracts += o.contracts; value += o.market_value || 0; today += o.today_pnl || 0; total += o.total_pnl || 0;
    });
    var rows = strategies.map(function (o) {
      var c = o.contract;
      var moneyness = o.itm === true ? "ITM" : (o.itm === false ? "OTM" : "");
      var moneyCls = moneyness === "ITM" ? "pos" : (moneyness === "OTM" ? "neg" : "");
      var label = o.symbol + ' ' + o.direction + ' $' + c.strike + ' ' + c.type + ' ' + fmtExpiry(c.expiration) + (moneyness ? ' (' + moneyness + ')' : '');
      var pnl = o.total_pnl;
      var detail = '<div class="pos-opt-list">' + renderOptionRow(o.symbol, o) + '</div>' +
        '<div class="pf-actions">' +
          '<button class="pf-close" data-pid="' + o.position_id + '" data-legs="' + JSON.stringify(o.leg_ids) + '" data-label="' + label + '">Close contract…</button>' +
          '<button class="pf-del" data-pid="' + o.position_id + '" data-legs="' + JSON.stringify(o.leg_ids) + '" data-label="' + label + '">✕</button>' +
        '</div>';
      var key = holdingKey(o.leg_ids);
      return '<div class="pf-item">' +
        '<div class="pf-row' + (key === selectedHolding ? " selected" : "") + '" data-holding="' + key + '"><span class="pf-label ' + moneyCls + '">' + label + '</span>' +
        '<span class="pf-contracts tabular">' + o.contracts + ' contracts</span>' +
        '<span class="pf-val tabular">' + fmtMoney(o.market_value) + '</span>' +
        '<span class="pf-pnl tabular ' + (pnl == null ? "" : (pnl >= 0 ? "pos" : "neg")) + '">' + fmtSigned(pnl) + '</span>' +
        '</div><div class="pf-detail" style="display:none">' + detail + '</div></div>';
    }).join("");
    return '<div class="pf-section options">' +
      '<div class="stage-head"><h2>Options</h2><span class="hint">strategies by contract + expiration</span></div>' +
      '<div class="pf-summary">' +
        statCard2("Strategies", strategies.length) +
        statCard2("Contracts", totalContracts) +
        statCard2("Options value", fmtMoney(value)) +
        statCard2("Today", fmtSigned(today)) +
        statCard2("Total return", fmtSigned(total)) +
      '</div>' +
      '<div class="pf-rows">' + rows + '</div></div>';
  }

  // Whole-account strip only -- four numbers, one row. Per-asset holdings
  // moved into that asset's own expanded accordion row (renderAssetHoldings)
  // so this never grows past a single line no matter how many positions
  // exist across however many assets.
  function renderPortfolioStrip() {
    var totalValue = 0, today = 0, total = 0;
    portfolio.forEach(function (p) {
      if (p.valuation && p.valuation.summary) {
        totalValue += p.valuation.summary.total_value || 0;
        today += p.valuation.summary.total_today_pnl || 0;
        total += p.valuation.summary.total_pnl || 0;
      }
    });
    return '<div class="portfolio-strip">' +
      '<div class="pos-stat"><div class="stat-label">Total value</div><div class="stat-value tabular">' + fmtMoney(totalValue) + '</div></div>' +
      '<div class="pos-stat"><div class="stat-label">Today</div><div class="stat-value tabular ' + (today >= 0 ? "pos" : "neg") + '">' + fmtSigned(today) + '</div></div>' +
      '<div class="pos-stat"><div class="stat-label">Total return</div><div class="stat-value tabular ' + (total >= 0 ? "pos" : "neg") + '">' + fmtSigned(total) + '</div></div>' +
      '<div class="pos-stat"><div class="stat-label">Realized P&L</div><div class="stat-value tabular ' + (realized >= 0 ? "pos" : "neg") + '">' + fmtSigned(realized) + '</div></div>' +
      '</div>';
  }

  // This asset's own holdings only -- same section renderers as before,
  // just filtered to one symbol and dropped inside its accordion row
  // instead of living in one global list.
  function renderAssetHoldings(sym) {
    var h = deriveHoldings();
    var shares = h.shares.filter(function (s) { return s.symbol === sym; });
    var strategies = h.strategies.filter(function (o) { return o.symbol === sym; });
    if (!shares.length && !strategies.length) return "";
    return renderSharesSection(shares) + renderOptionsSection(strategies);
  }

  // Per-holding narrative: entry context + current DNA read + a suggested
  // action, in plain language. Every number here is real (holding data from
  // the loaded portfolio, DNA stats from the already-computed tier assess)
  // -- this composes existing facts into a sentence, it doesn't predict
  // anything new. "Primary" DNA read prefers Confirmation/Timing (the tiers
  // that actually decide whether a position gets challenged) over Direction,
  // which is too slow to say anything useful about a specific holding.
  function primaryReadFor(sym) {
    var c = cache[sym];
    if (!c) return null;
    var t = c.assess.tiers;
    var order = [t.confirm, t.timing, t.owner, t.backbone, t.micro];
    for (var i = 0; i < order.length; i++) if (order[i] && !order[i].empty) return order[i];
    return null;
  }

  function daysBetween(iso, toMs) {
    var t = new Date(String(iso).replace(" ", "T") + (String(iso).endsWith("Z") ? "" : "Z")).getTime();
    if (isNaN(t)) return null;
    return Math.round(((toMs != null ? toMs : Date.now()) - t) / 86400000);
  }

  function plWord(pct) {
    if (pct == null) return "flat so far";
    var abs = Math.abs(pct).toFixed(1);
    return pct >= 0 ? "up " + abs + "%" : "down " + abs + "%";
  }

  function shareInsight(sym, s, primary) {
    var held = daysBetween(s.first_entry);
    var lines = [];
    lines.push("You entered these shares " + (held == null ? "recently" : held + " day" + (held === 1 ? "" : "s") + " ago") +
      " at $" + Number(s.avg_cost).toFixed(2) + " — " + plWord(s.total_return_pct) + " right now.");
    if (primary) {
      lines.push("DNA's " + primary.tier.label.toLowerCase() + " read is currently " + primary.text +
        " (health " + (primary.lead.health != null ? primary.lead.health + "%" : "n/a") + ", " + tfLabel(primary.lead.timeframe) + " chart).");
      if (primary.tone === "neg") lines.push("That's a broken structure under an open position — this is a protect-the-shares conversation, not an add-more one.");
      else if (primary.tone === "pos") lines.push("Structure is still constructive here — nothing says trim yet.");
    }
    return lines;
  }

  function optionInsight(sym, o, primary) {
    var held = daysBetween(o.first_entry);
    var c = o.contract;
    var dte = c.expiration ? daysBetween(new Date().toISOString(), new Date(c.expiration).getTime()) : null;
    var moneyness = o.itm === true ? "in the money" : (o.itm === false ? "out of the money" : "moneyness unknown");
    var lines = [];
    lines.push("You entered this " + c.type + " " + (held == null ? "recently" : held + " day" + (held === 1 ? "" : "s") + " ago") +
      " at $" + Number(o.avg_cost).toFixed(2) + " — " + plWord(o.total_return_pct) + ", currently " + moneyness +
      (dte != null ? ", " + dte + " day" + (dte === 1 ? "" : "s") + " to expiration" : "") + ".");
    if (primary) {
      lines.push("DNA's " + primary.tier.label.toLowerCase() + " read is currently " + primary.text +
        " (health " + (primary.lead.health != null ? primary.lead.health + "%" : "n/a") + ", " + tfLabel(primary.lead.timeframe) + " chart).");
    }
    // Suggested action -- combines moneyness + days-to-expiry + DNA tone.
    // Every branch states its own reasoning so it reads as a case, not a verdict.
    if (primary && primary.tone === "neg") {
      lines.push("Structure has broken down under this position — worth deciding on protect/close rather than waiting it out.");
    } else if (dte != null && dte <= 10) {
      lines.push("Under 10 days to expiration — time decay is a real factor here regardless of what the campaign is doing structurally.");
    } else if (o.itm && primary && primary.tone === "pos" && dte != null && dte > 21) {
      lines.push("In the money, room left on the clock, and DNA still constructive — rolling up to lock in some of this while staying in the move is a reasonable option, not a must.");
    } else if (o.itm === false && primary && primary.tone !== "pos") {
      lines.push("Out of the money and DNA isn't confirming strength — this one needs the underlying to move soon to matter.");
    }
    return lines;
  }

  // Roll-candidate suggestion from the real options chain -- strike/expiry
  // only (Massive free plan has no greeks), so the heuristic is simple and
  // says so: same type, further out-of-the-money in the campaign's
  // direction, same expiration if available else the next one out.
  function suggestRollCandidate(chain, currentStrike, currentExp, type, tone) {
    if (!chain || !chain.contracts || !chain.contracts.length) return null;
    if (tone !== "pos") return null; // only worth suggesting a roll when DNA agrees
    var sameType = chain.contracts.filter(function (c) { return c.contract_type === type; });
    var better = sameType.filter(function (c) {
      return type === "CALL" ? c.strike > currentStrike : c.strike < currentStrike;
    });
    if (!better.length) return null;
    better.sort(function (a, b) {
      var expDiff = Math.abs(new Date(a.expiration) - new Date(currentExp)) - Math.abs(new Date(b.expiration) - new Date(currentExp));
      if (expDiff !== 0) return expDiff;
      return Math.abs(a.strike - currentStrike) - Math.abs(b.strike - currentStrike);
    });
    return better[0];
  }

  // Tracks exactly one holding at a time -- the one clicked in Shares/Options
  // below -- instead of printing every holding's insight block at once.
  // Auto-picks when there's only one holding total (no reason to make that
  // click mandatory); otherwise prompts you to pick which one. Styled and
  // titled to match "What to do" (same .action card language) and sits
  // directly above it, since this IS a what-to-do read -- just scoped to
  // the position you're actually in, instead of the whole campaign.
  function renderPositionInsights(sym) {
    var h = deriveHoldings();
    var shares = h.shares.filter(function (s) { return s.symbol === sym; });
    var strategies = h.strategies.filter(function (o) { return o.symbol === sym; });
    var all = shares.map(function (s) { return { kind: "share", data: s, key: holdingKey(s.leg_ids) }; })
      .concat(strategies.map(function (o) { return { kind: "option", data: o, key: holdingKey(o.leg_ids) }; }));
    if (!all.length) return "";

    var head = '<div class="stage-head"><h2>Campaign insights</h2><span class="hint">what DNA says about the position you\'re actually in</span></div>';

    var pick = all.length === 1 ? all[0] : all.filter(function (x) { return x.key === selectedHolding; })[0];
    if (!pick) {
      return head + '<div class="no-actions">You\'re holding ' + all.length + ' different things on ' + sym + ' — click one in Shares/Options below to see its insight here.</div>';
    }

    var primary = primaryReadFor(sym);
    var title, lines, chainSlot = "";
    if (pick.kind === "share") {
      title = pick.data.symbol + " shares"; lines = shareInsight(sym, pick.data, primary);
    } else {
      var c = pick.data.contract;
      title = "$" + c.strike + " " + c.type + " · " + fmtExpiry(c.expiration);
      lines = optionInsight(sym, pick.data, primary);
      chainSlot = '<div class="chain-suggest" data-sym="' + sym + '" data-strike="' + c.strike + '" data-exp="' + c.expiration + '" data-type="' + c.type + '" data-tone="' + (primary ? primary.tone : "") + '"></div>';
    }
    var level = primary ? ({ neg: "critical", warn: "watch", pos: "opportunity" }[primary.tone] || "") : "";
    var ic = { critical: "⚠", watch: "⚠", opportunity: "▲" }[level] || "•";
    return head + '<div class="actions"><div class="action ' + level + '"><div class="ic">' + ic + '</div><div>' +
      '<div class="a-title">' + title + '</div>' +
      lines.map(function (l) { return '<div class="a-text">' + l + '</div>'; }).join("") +
      chainSlot + '</div></div></div>';
  }

  function closeHolding(pid, legIds, label) {
    var price = window.prompt("Exit price for " + label + "? (blank = no price)", "");
    if (price === null) return;
    var body = { status: "CLOSED" };
    if (String(price).trim() !== "") body.exit_price = Number(price);
    var base = baseInput.value.trim().replace(/\/$/, "");
    return Promise.all(legIds.map(function (lid) {
      return fetch(base + "/positions/" + pid + "/instruments/" + lid, {
        method: "PATCH",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(body)
      });
    })).then(function () {
      return Promise.all([loadPortfolio(), loadClosedPositions()]).then(paint);
    });
  }

  function deleteHolding(pid, legIds, label) {
    if (!window.confirm("Delete " + label + "?")) return;
    var base = baseInput.value.trim().replace(/\/$/, "");
    return Promise.all(legIds.map(function (lid) {
      return fetch(base + "/positions/" + pid + "/instruments/" + lid, { method: "DELETE", headers: authHeaders() });
    })).then(function () {
      return Promise.all([loadPortfolio(), loadClosedPositions()]).then(paint);
    });
  }

  // Wires the .pf-manage button + its shared dialog (markup from
  // renderManageDialog). Re-run every paint() since the dialog is
  // rebuilt with the DOM each time; native <dialog> handles its own
  // show/hide state so nothing needs to survive across repaints.
  function wireManageDialog() {
    var dialog = document.getElementById("position-manage-dialog");
    var openBtn = document.querySelector(".pf-manage");
    if (!dialog || !openBtn) return;

    if (!openBtn.disabled) {
      openBtn.addEventListener("click", function () {
        var max = Number(openBtn.dataset.max || 0);
        dialog.dataset.pid = openBtn.dataset.pid;
        dialog.dataset.legs = openBtn.dataset.legs;
        document.getElementById("manage-dialog-title").textContent = openBtn.dataset.label || "";
        document.getElementById("manage-dialog-open").textContent = openBtn.dataset.qtyText || "";
        document.getElementById("manage-dialog-avg").textContent = openBtn.dataset.avg || "";
        document.getElementById("manage-dialog-current").textContent = openBtn.dataset.current || "";
        var qtyInput = document.getElementById("manage-dialog-qty");
        qtyInput.max = max; qtyInput.value = max;
        document.getElementById("manage-dialog-price").value = "";
        document.getElementById("manage-dialog-time").value = "";
        document.getElementById("manage-dialog-notes").value = "";
        var errEl = document.getElementById("manage-dialog-error");
        errEl.textContent = ""; errEl.style.display = "none";
        dialog.showModal();
      });
    }

    Array.prototype.forEach.call(dialog.querySelectorAll("[data-manage-close],[data-manage-cancel]"), function (b) {
      b.addEventListener("click", function () { dialog.close(); });
    });

    var submitBtn = dialog.querySelector("[data-manage-submit]");
    submitBtn.addEventListener("click", function () {
      var errEl = document.getElementById("manage-dialog-error");
      var pid = dialog.dataset.pid;
      var legs = JSON.parse(dialog.dataset.legs || "[]");
      var qty = Number(document.getElementById("manage-dialog-qty").value);
      var max = Number(document.getElementById("manage-dialog-qty").max);
      if (!qty || qty <= 0) {
        errEl.textContent = "Enter a quantity greater than 0."; errEl.style.display = "block"; return;
      }
      if (max && qty > max + 1e-9) {
        errEl.textContent = "Quantity exceeds the open holding (" + max + ")."; errEl.style.display = "block"; return;
      }
      var priceRaw = document.getElementById("manage-dialog-price").value;
      var timeRaw = document.getElementById("manage-dialog-time").value;
      var notesRaw = document.getElementById("manage-dialog-notes").value;
      var body = { instrument_ids: legs, quantity: qty };
      if (priceRaw !== "") body.exit_price = Number(priceRaw);
      if (timeRaw !== "") body.exit_time = new Date(timeRaw).toISOString();
      if (notesRaw !== "") body.notes = notesRaw;

      var base = baseInput.value.trim().replace(/\/$/, "");
      submitBtn.disabled = true;
      fetch(base + "/positions/" + pid + "/instruments/close", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(body)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
      }).then(function (res) {
        submitBtn.disabled = false;
        if (!res.ok) {
          errEl.textContent = (res.d && res.d.error) || "Could not close that quantity.";
          errEl.style.display = "block";
          return;
        }
        dialog.close();
        return Promise.all([loadPortfolio(), loadClosedPositions()]).then(paint);
      }).catch(function (ex) {
        submitBtn.disabled = false;
        errEl.textContent = "Error: " + ex.message;
        errEl.style.display = "block";
      });
    });
  }

  function wirePortfolio() {
    Array.prototype.forEach.call(document.querySelectorAll(".pf-row"), function (row) {
      // Selecting a holding is what drives the chart + Position Insight panel
      // now -- one holding tracked at a time instead of printing every
      // holding's insight at once. Re-paints, which also re-opens this row's
      // detail (below) so the Close/Delete actions stay reachable.
      if (row.dataset.holding === selectedHolding) {
        var d = row.parentElement.querySelector(".pf-detail");
        if (d) d.style.display = "";
      }
      row.addEventListener("click", function (e) {
        if (e.target.closest(".pf-del") || e.target.closest(".pf-jump") || e.target.closest(".pf-close")) return;
        selectedHolding = row.dataset.holding;
        if (selected) {
          var chosen = selectedAssetHoldings(selected).pick;
          chartModeOverride[selected] = chosen && chosen.kind === "option" ? "option" : "underlying";
          chartTfOverride[selected] = null;
        }
        paint();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pf-jump"), function (b) {
      b.addEventListener("click", function () {
        selected = b.dataset.sym;
        loadSymbol(selected, false).then(paint);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pf-close"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        closeHolding(b.dataset.pid, JSON.parse(b.dataset.legs || "[]"), b.dataset.label || "");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pf-del"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        deleteHolding(b.dataset.pid, JSON.parse(b.dataset.legs || "[]"), b.dataset.label || "");
      });
    });
  }

  // The asset list IS the detail view now -- one row per tracked asset,
  // ranked worst-first same as before. Collapsed by default; the selected
  // one expands in place (renderAssetBody) instead of a separate section
  // living elsewhere on the page. One expanded at a time, click to switch.
  function renderAssetList() {
    // What you're actually holding comes first (portfolio position), then
    // urgency, then name -- so an asset you have money in never gets buried
    // under a "nothing to do" one you don't hold.
    var held = {};
    portfolio.forEach(function (p) { held[p.summary.symbol] = true; });
    var ranked = assets.slice().sort(function (x, y) {
      var hx = held[x.symbol] ? 0 : 1, hy = held[y.symbol] ? 0 : 1;
      if (hx !== hy) return hx - hy;
      var ax = cache[x.symbol], ay = cache[y.symbol];
      var lx = ax ? LEVEL_ORDER[ax.assess.level] : 9, ly = ay ? LEVEL_ORDER[ay.assess.level] : 9;
      return lx - ly || x.symbol.localeCompare(y.symbol);
    });
    var pionex = '<section class="dna-panel pionex-wallet" data-role="pionex">' +
      '<div class="stage-head"><h2>Pionex</h2><span class="hint">crypto spot wallet · read-only · bots and earn excluded</span></div>' +
      '<div class="pionex-body"><div class="dna-news-empty">Loading Pionex wallet…</div></div></section>';
    return pionex + '<div class="stage-head"><h2>Assets</h2><span class="hint">held positions first, then by urgency · click one to open it</span></div>' +
      '<div class="asset-list">' + ranked.map(function (as) {
        var c = cache[as.symbol];
        var expanded = as.symbol === selected;
        if (!c) {
          return '<div class="asset-row quiet"><button class="asset-row-head" data-sym="' + as.symbol + '">' +
            '<span class="ar-top"><span class="ar-sym">' + as.symbol + '</span></span><span class="ar-why">loading…</span></button></div>';
        }
        var a = c.assess, states = c.states;
        var px = states.length ? states.slice().sort(function (p, q) { return tfKey(p.timeframe) - tfKey(q.timeframe); })[0].close : null;
        var head = '<button class="asset-row-head" data-sym="' + as.symbol + '">' +
          '<span class="ar-top">' +
            '<span class="ar-sym">' + as.symbol + '</span>' +
            (px != null ? '<span class="ar-price tabular">$' + px + '</span>' : '') +
            '<span class="ar-state">' + a.headline + '</span>' +
            (a.warmup ? '<span class="ar-warmup" title="Campaign already constructive, confirmation has not caught up yet, fresh entry signal on ' + tfLabel(a.warmup.row.timeframe) + '">warming up</span>' : '') +
          '</span>' +
          '<span class="ar-why">' + a.why + '</span>' +
          '<span class="ar-chev">›</span></button>';
        var body = expanded ? '<div class="asset-row-body">' + renderAssetBody(as.symbol) + '</div>' : '';
        return '<div class="asset-row ' + a.level + (expanded ? ' expanded' : '') + '">' + head + body + '</div>';
      }).join("") + '</div>';
  }

  // --- Your position: manual log, no broker ------------------------------
  var posCache = {}, chainCache = {}, insightCache = {};

  function loadChain(sym) {
    var base = baseInput.value.trim().replace(/\/$/, "");
    if (chainCache[sym]) return Promise.resolve(chainCache[sym]);
    return fetch(base + "/options/chain/" + encodeURIComponent(sym), { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : { contracts: [], expirations: [] }; })
      .catch(function () { return { contracts: [], expirations: [] }; })
      .then(function (d) { chainCache[sym] = d; return d; });
  }

  function loadInsight(pid) {
    var base = baseInput.value.trim().replace(/\/$/, "");
    if (insightCache[pid]) return Promise.resolve(insightCache[pid]);
    return fetch(base + "/positions/" + encodeURIComponent(pid) + "/insight", { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (d) { insightCache[pid] = d; return d; });
  }

  function loadPositions(sym) {
    var base = baseInput.value.trim().replace(/\/$/, "");
    return fetch(base + "/positions?symbol=" + encodeURIComponent(sym), { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : { positions: [] }; })
      .catch(function () { return { positions: [] }; })
      .then(function (d) {
        var summaries = d.positions || [];
        return Promise.all(summaries.map(function (p) {
          return fetch(base + "/positions/" + p.id, { headers: authHeaders() })
            .then(function (r) { return r.ok ? r.json() : p; })
            .catch(function () { return p; })
            .then(function (detail) {
              // Reuse the portfolio's valuation for open positions (already
              // fetched), skip it for closed ones -- avoids double Massive
              // calls on every load.
              if (p.status === "OPEN") {
                if (portfolioById[p.id] !== undefined) {
                  detail.valuation = portfolioById[p.id];
                } else {
                  return fetch(base + "/positions/" + p.id + "/valuation", { headers: authHeaders() })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .catch(function () { return null; })
                    .then(function (v) { detail.valuation = v; return detail; });
                }
              } else {
                detail.valuation = null;
              }
              return detail;
            });
        }));
      })
      .then(function (detailed) { posCache[sym] = detailed; });
  }

  function fmtMoney(n) { return n == null ? "—" : "$" + Number(n).toFixed(2); }
  function fmtSigned(n) { return n == null ? "—" : (n >= 0 ? "+" : "") + fmtMoney(n); }
  function fmtPct(n) { return n == null ? "—" : (n >= 0 ? "+" : "") + Number(n).toFixed(1) + "%"; }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(String(iso).replace(" ", "T") + (String(iso).endsWith("Z") ? "" : "Z"));
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function statCard(label, sub, value, today, total) {
    return '<div class="pos-stat"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value tabular">' + fmtMoney(value) + '</div>' +
      '<div class="stat-sub tabular">' + sub + ' · today ' + fmtSigned(today) + ' · total ' + fmtSigned(total) + '</div></div>';
  }

  function renderOptionRow(sym, o) {
    var c = o.contract;
    var moneyness = o.itm === true ? "ITM" : (o.itm === false ? "OTM" : "");
    var moneyCls = moneyness === "ITM" ? "pos" : (moneyness === "OTM" ? "neg" : "");
    var title = sym + " $" + c.strike + " " + c.type + (moneyness ? " (" + moneyness + ")" : "");
    var pnl = o.total_pnl, pnlCls = pnl == null ? "" : (pnl >= 0 ? "pos" : "neg");
    var detail =
      '<span><b>avg cost</b> ' + fmtMoney(o.avg_cost) + '</span>' +
      '<span><b>current</b> ' + fmtMoney(o.current_price) + '</span>' +
      '<span><b>market value</b> ' + fmtMoney(o.market_value) + '</span>' +
      '<span><b>bought</b> ' + fmtDate(o.first_entry) + '</span>' +
      '<span><b>breakeven</b> ' + fmtMoney(o.breakeven) + '</span>' +
      '<span><b>today</b> ' + fmtSigned(o.today_pnl) + ' (' + fmtPct(o.today_return_pct) + ')</span>' +
      '<span><b>total</b> ' + fmtSigned(o.total_pnl) + ' (' + fmtPct(o.total_return_pct) + ')</span>';
    return '<div class="pos-opt"><div class="pos-opt-top">' +
      '<span class="chip ' + moneyCls + '">' + title + '</span>' +
      '<span class="pos-opt-contracts tabular">' + o.contracts + ' contracts</span>' +
      '<span class="pos-opt-pnl tabular ' + pnlCls + '">' + fmtSigned(pnl) + '</span>' +
      '</div><div class="pos-opt-detail">' + detail + '</div></div>';
  }

  function renderValuationBody(sym, v) {
    var s = v.summary, html = "";
    var stats = [];
    if (s.options_contracts > 0 || s.options_value > 0) {
      stats.push(statCard("Options", s.options_contracts + " contracts", s.options_value, s.options_today_pnl, s.options_total_pnl));
    }
    if (s.stock_shares > 0 || s.stock_value > 0) {
      stats.push(statCard("Stock", s.stock_shares + " shares", s.stock_value, s.stock_today_pnl, s.stock_total_pnl));
    }
    if (stats.length) html += '<div class="pos-stats">' + stats.join("") + '</div>';
    var opts = v.options || [];
    if (opts.length) html += '<div class="pos-opt-list">' + opts.map(function (o) { return renderOptionRow(sym, o); }).join("") + '</div>';
    var u = v.underlying;
    if (u && u.current != null) html += '<div class="pos-und tabular">' + sym + ' last ' + fmtMoney(u.current) + (u.prev != null ? ' (prev ' + fmtMoney(u.prev) + ')' : '') + '</div>';
    return html;
  }

  function renderPositionRow(p) {
    var dir = p.direction === "LONG" ? "▲ LONG" : "▼ SHORT";
    var dirCls = p.direction === "LONG" ? "pos" : "neg";
    var open = p.status === "OPEN";
    var actions = (open ? '<button class="pos-close" data-id="' + p.id + '">Close</button>' : "") +
      '<button class="pos-del" data-id="' + p.id + '" title="Delete position">✕</button>';
    var body;
    if (p.valuation && p.valuation.summary) {
      body = renderValuationBody(p.symbol, p.valuation);
    } else {
      var legs = (p.instruments || []).map(function (i) {
        var label = i.instrument_type === "SHARE"
          ? i.instrument_type + " ×" + i.quantity + " @ " + fmtMoney(i.entry_price)
          : i.instrument_type + " " + (i.strike != null ? i.strike : "") + (i.expiration ? " " + i.expiration : "") + " ×" + i.quantity + " @ " + fmtMoney(i.entry_price);
        var cls = i.status === "OPEN" ? "pos" : (i.status === "ROLLED" ? "warn" : "");
        var suffix = i.status === "OPEN" ? "" : " · " + i.status.toLowerCase();
        return '<span class="chip ' + cls + '">' + label + suffix + '</span>';
      }).join("");
      body = '<div class="pos-legs">' + (legs || '<span class="chip">no legs</span>') + '</div>';
    }
    return '<div class="pos-card' + (open ? "" : " closed") + '">' +
      '<div class="pos-top"><span class="chip ' + dirCls + '">' + dir + '</span>' +
      '<span class="pos-status">' + p.status + '</span>' +
      '<span class="pos-date">opened ' + age(p.opened_at).text + '</span>' + actions + '</div>' + body + '</div>';
  }

  function renderPositionForm(sym) {
    return '<form class="pos-form" data-sym="' + sym + '">' +
      '<select name="direction"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>' +
      '<select name="type"><option value="SHARE">Shares</option><option value="CALL">Call</option><option value="PUT">Put</option></select>' +
      '<select name="contract" class="opt-field" style="display:none"><option value="">pick contract…</option></select>' +
      '<input name="strike" type="number" min="0" step="any" placeholder="strike $" class="opt-manual" style="display:none">' +
      '<input name="expiration" type="text" placeholder="expiry YYYY-MM-DD" class="opt-manual" style="display:none">' +
      '<input name="quantity" type="number" min="0" step="any" placeholder="qty" required>' +
      '<input name="entry_price" type="number" min="0" step="any" placeholder="entry $" required>' +
      '<input name="entry_time" type="datetime-local">' +
      '<input name="notes" type="text" placeholder="notes">' +
      '<button type="submit">Open position</button>' +
      '<div class="pos-hint">"entry time" is when you entered (blank = now). For Call/Put, pick the contract from the chain instead of typing strike/expiry.</div>' +
      '<div class="pos-form-err" style="display:none"></div>' +
      '</form>';
  }

  function renderPosition(sym) {
    var positions = posCache[sym];
    var loaded = positions !== undefined;
    var list = (positions || []);
    var listHtml = !loaded
      ? '<div class="position-placeholder">loading positions…</div>'
      : (list.length === 0
          ? '<div class="position-placeholder">No positions logged for ' + sym + ' yet. Open one above — the system never opens anything on its own.</div>'
          : list.map(renderPositionRow).join(""));
    return '<div class="position-wrap"><div class="stage-head"><h2>Your position</h2><span class="hint">' + sym + ' — manual log, no broker</span></div>' +
      renderPositionForm(sym) + listHtml + '</div>';
  }

  function wirePosition() {
    var openBtn = document.querySelector(".open-pos-btn");
    var openForm = document.querySelector(".open-pos-form");
    if (openBtn && openForm) {
      openBtn.addEventListener("click", function () {
        var show = openForm.style.display === "none";
        openForm.style.display = show ? "" : "none";
        openBtn.textContent = show ? "− Close" : "+ Open a position in " + (openForm.dataset.sym || "");
      });
    }
    var form = document.querySelector(".pos-form");
    if (!form) return;
    var sym = form.dataset.sym;
    var typeSel = form.querySelector('select[name="type"]');
    var contractSel = form.querySelector('select[name="contract"]');

    function populateContracts(type) {
      var chain = chainCache[sym];
      var contracts = chain ? (chain.contracts || []).filter(function (c) { return c.contract_type === type; }) : [];
      contractSel.innerHTML = '<option value="">pick contract…</option>' + contracts.map(function (c) {
        return '<option value="' + c.ticker + '" data-strike="' + c.strike + '" data-exp="' + c.expiration + '" data-type="' + c.contract_type + '">' +
          c.contract_type + ' $' + c.strike + ' · ' + (c.expiration || "").slice(5) + '</option>';
      }).join("");
    }

    function syncOptFields() {
      var type = typeSel.value;
      var isOpt = type !== "SHARE";
      var chain = chainCache[sym];
      var haveChain = isOpt && chain && (chain.contracts || []).some(function (c) { return c.contract_type === type; });
      contractSel.style.display = (isOpt && haveChain) ? "" : "none";
      Array.prototype.forEach.call(form.querySelectorAll(".opt-manual"), function (f) {
        f.style.display = (isOpt && !haveChain) ? "" : "none";
        if (f.name === "strike") f.required = (isOpt && !haveChain);
      });
      if (isOpt && haveChain) populateContracts(type);
    }

    typeSel.addEventListener("change", function () {
      if (typeSel.value !== "SHARE" && !chainCache[sym]) {
        loadChain(sym).then(syncOptFields);
      } else {
        syncOptFields();
      }
    });
    syncOptFields();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var fd = new FormData(form);
      var type = fd.get("type");
      var entryTimeVal = fd.get("entry_time");
      var errEl = form.querySelector(".pos-form-err");
      errEl.style.display = "none";

      var instrument = {
        type: type,
        quantity: Number(fd.get("quantity")),
        entry_price: Number(fd.get("entry_price")),
        entry_time: entryTimeVal ? new Date(entryTimeVal).toISOString() : new Date().toISOString()
      };
      if (type !== "SHARE") {
        var opt = contractSel.selectedOptions[0];
        if (opt && opt.dataset.strike) {
          instrument.strike = Number(opt.dataset.strike);
          instrument.expiration = opt.dataset.exp || null;
        } else {
          instrument.strike = fd.get("strike") ? Number(fd.get("strike")) : null;
          instrument.expiration = fd.get("expiration") || null;
        }
      }
      var body = { symbol: sym, direction: fd.get("direction"), notes: fd.get("notes") || null, instrument: instrument };
      var base = baseInput.value.trim().replace(/\/$/, "");

      fetch(base + "/positions", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(body)
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) {
            errEl.textContent = "Couldn't open: " + (res.d.error || res.d.detail || "HTTP " + res.d.status);
            errEl.style.display = "block";
            return;
          }
          form.reset();
          syncOptFields();
          return Promise.all([loadPortfolio(), loadClosedPositions()]).then(paint);
        })
        .catch(function (ex) { errEl.textContent = "Error: " + ex.message; errEl.style.display = "block"; });
    });

  }

  function sumBy(list, key) {
    return list.reduce(function (n, x) { return n + (Number(x[key]) || 0); }, 0);
  }

  function aggregateReturn(list) {
    var pnl = sumBy(list, "total_pnl"), cost = sumBy(list, "market_value") - pnl;
    return { pnl: pnl, pct: cost ? pnl / cost * 100 : null };
  }

  function performanceText(pnl, pct) {
    return fmtSigned(pnl) + " (" + fmtPct(pct) + ")";
  }

  function selectedAssetHoldings(sym) {
    var h = deriveHoldings();
    var shares = h.shares.filter(function (x) { return x.symbol === sym; });
    var options = h.strategies.filter(function (x) { return x.symbol === sym; });
    var all = shares.map(function (x) { return { kind: "share", data: x, key: holdingKey(x.leg_ids) }; })
      .concat(options.map(function (x) { return { kind: "option", data: x, key: holdingKey(x.leg_ids) }; }));
    if (all.length && !all.some(function (x) { return x.key === selectedHolding; })) selectedHolding = all[0].key;
    return { shares: shares, options: options, all: all, pick: all.filter(function (x) { return x.key === selectedHolding; })[0] || null };
  }

  function holdingLabel(x) {
    if (x.kind === "share") return x.data.symbol + " shares";
    return x.data.symbol + " $" + x.data.contract.strike + " " + x.data.contract.type;
  }

  // Partial-close dialog: one shared <dialog>, populated from whichever
  // .pf-manage button opened it (see wireManageDialog). Backs
  // POST /positions/<id>/instruments/close, which supports closing less
  // than the full open quantity -- close 1 of 5 contracts and the other 4
  // stay open.
  function renderManageDialog() {
    return '<dialog class="position-dialog" id="position-manage-dialog">' +
      '<form method="dialog" class="position-dialog-inner">' +
        '<div class="position-dialog-head"><div><div class="dna-k">Manage holding</div><h3 id="manage-dialog-title"></h3></div>' +
          '<button type="button" class="position-dialog-close" data-manage-close aria-label="Close">×</button></div>' +
        '<div class="position-dialog-summary">' +
          '<div><div class="dna-k">Open</div><div class="dna-v" id="manage-dialog-open"></div></div>' +
          '<div><div class="dna-k">Avg cost</div><div class="dna-v" id="manage-dialog-avg"></div></div>' +
          '<div><div class="dna-k">Current</div><div class="dna-v" id="manage-dialog-current"></div></div></div>' +
        '<div class="position-dialog-form">' +
          '<label>Quantity to close<input type="number" id="manage-dialog-qty" min="0" step="any" required></label>' +
          '<label>Exit price<input type="number" id="manage-dialog-price" min="0" step="any" placeholder="optional"></label>' +
          '<label>Exit time<input type="datetime-local" id="manage-dialog-time"></label>' +
          '<label class="full">Notes<input type="text" id="manage-dialog-notes" placeholder="optional"></label></div>' +
        '<div class="position-dialog-error" id="manage-dialog-error" role="alert"></div>' +
        '<div class="position-dialog-note">Closes only the quantity entered above; any remainder stays open under the same holding.</div>' +
        '<div class="position-dialog-actions"><button type="button" data-manage-cancel>Cancel</button>' +
          '<button type="button" class="pf-close" data-manage-submit>Close quantity</button></div>' +
      '</form></dialog>';
  }

  function timelineFor(pick) {
    if (!pick || pick.kind !== "option") return null;
    var entryMs = parseIsoMs(pick.data.first_entry);
    var now = Date.now(), endMs = null, expiry = "Open position";
    if (pick.kind === "option" && pick.data.contract.expiration) {
      endMs = new Date(pick.data.contract.expiration + "T23:59:59Z").getTime();
      expiry = "Expiry · " + fmtDate(pick.data.contract.expiration);
    }
    var pct = endMs && entryMs ? Math.max(0, Math.min(100, (now - entryMs) / (endMs - entryMs) * 100)) : 100;
    var daysLeft = endMs ? Math.max(0, Math.ceil((endMs - now) / 86400000)) : null;
    return { width: pct.toFixed(1) + "%", progress: endMs ? Math.round(pct) + "% elapsed" : "Open-ended holding", entry: "Entry · " + fmtDate(pick.data.first_entry), today: daysLeft == null ? "Today" : daysLeft + " day" + (daysLeft === 1 ? "" : "s") + " left", expiry: expiry };
  }

  function toneClass(tone) { return tone === "neg" ? "neg" : tone === "warn" ? "warn" : tone === "pos" ? "pos" : ""; }

  function holdingGuidance(pick, primary) {
    if (!pick) return { title: "No holding selected", summary: "Select a stock or contract to calculate position-specific guidance.", bullets: [] };
    var lines = pick.kind === "share" ? shareInsight(pick.data.symbol, pick.data, primary) : optionInsight(pick.data.symbol, pick.data, primary);
    var state = primary && primary.tone === "neg" ? "elevated" : primary && primary.tone === "warn" ? "needs attention" : "controlled";
    var title, context;
    if (pick.kind === "share") {
      title = pick.data.symbol + " shares · risk " + state;
      context = (daysBetween(pick.data.first_entry) || 0) + " days held";
    } else {
      var c = pick.data.contract;
      var dte = c.expiration ? Math.max(0, daysBetween(new Date().toISOString(), new Date(c.expiration + "T23:59:59Z").getTime())) : null;
      title = "$" + c.strike + " " + c.type + " · risk " + state;
      context = (dte == null ? "Expiration unavailable" : dte + " DTE") + (pick.data.itm === true ? " · in the money" : pick.data.itm === false ? " · out of the money" : "");
    }
    var dna = primary ? primary.tier.label + " is " + primary.text + " on " + tfLabel(primary.lead.timeframe) + "." : "No current position-specific DNA reading.";
    return { title: title, summary: context + " · " + dna, bullets: lines.slice(0, 3) };
  }

  // --- SEC filing watch (Catalyst Watch integration) ----------------------
  function secSafeUrl(raw) {
    try {
      var u = new URL(String(raw || ""));
      return u.protocol === "https:" && u.hostname === "www.sec.gov" ? u.href : "#";
    } catch (_err) { return "#"; }
  }
  function secFilingLabel(f) {
    if (f.category === "DILUTION_WATCH") return f.severity === "HIGH" ? "offering / dilution watch" : "financing capacity registered";
    if (f.category === "MATERIAL_FILING") return "material filing";
    return "ownership filing — direction unclassified";
  }
  function secFilingText(f) {
    return f.form + (f.variant ? " (" + f.variant + ")" : "") + " · " + secFilingLabel(f) + " · " + (f.filing_date || "no date");
  }
  function secPriority(f) {
    if (f.category === "DILUTION_WATCH" && f.severity === "HIGH") return 1;
    if (f.category === "DILUTION_WATCH") return 2;
    if (f.category === "MATERIAL_FILING") return 3;
    return 4;
  }
  function secTopFiling(filings) {
    if (!filings) return null;
    var list = (filings.new || []).concat(filings.recent || []);
    if (!list.length) return null;
    return list.slice().sort(function (a, b) { return secPriority(a) - secPriority(b); })[0];
  }
  function secStateText(filings, top) {
    if (filings == null) return "Loading SEC filings…";
    if (filings.configured === false) return "SEC filing watch not configured — SEC_USER_AGENT missing.";
    if (filings.error) return "SEC filing watch unavailable — " + filings.error + ".";
    if (filings.seeded === false) return "SEC filing watch not yet seeded — first poll pending.";
    if (filings.stale) return "SEC filing watch is stale — last successful poll over 24h ago.";
    if (top) return secFilingText(top);
    return "No new SEC filings in the alert window.";
  }

  function catalystWatchHtml(sym) {
    var c = cache[sym], states = c ? c.states : [], market = marketWatchBySymbol[sym] || {};
    var news = newsBySymbol[sym] || [];
    var filings = filingsBySymbol[sym];
    var secTop = secTopFiling(filings);
    var secOffering = secTop && secTop.category === "DILUTION_WATCH" && secTop.severity === "HIGH";
    var catalystPattern = /\b(424b5|s-3|fwp|offering|at-the-market|\batm\b|dilution|share count|8-k|10-q|10-k|earnings|guidance|sec filing)\b/i;
    var highPriorityPattern = /\b(424b5|s-3|fwp|offering|at-the-market|\batm\b|dilution|share count)\b/i;
    var catalyst = news.filter(function (n) { return catalystPattern.test(n.title || ""); })[0] || null;
    var hasSecNew = filings && filings.new && filings.new.length > 0;
    var highPriority = secOffering || (catalyst && highPriorityPattern.test(catalyst.title || ""));
    var lower = states.filter(function (s) { return tfKey(s.timeframe) <= tfKey("60"); });
    var constructive = lower.filter(function (s) { return phaseTone(s.phase) === "pos"; }).length;
    var failures = lower.filter(function (s) { return /FAIL/i.test(s.recent_event || "") || phaseTone(s.phase) === "neg"; }).length;
    var volumeHit = market.volumeRatio != null && market.volumeRatio >= 1.5;
    var premiumHit = market.premiumCompression != null && market.premiumCompression >= 20;
    var technicalHit = constructive >= 2 || failures >= 2;
    var confluence = [volumeHit, premiumHit, technicalHit].filter(Boolean).length;
    var active = Boolean(highPriority || hasSecNew || (catalyst && confluence >= 1) || confluence >= 2);
    var statusClass = highPriority ? " high" : active ? " active" : "";
    var status = highPriority ? "CATALYST RISK" : active ? "WATCH ACTIVE" : "MONITORING";
    var volumeText = market.volumeRatio == null ? "Waiting for chart volume." : market.volumeRatio.toFixed(2) + "× the prior 20-bar average on " + market.tf + ".";
    var premiumText = market.premiumCompression == null ? "Select an option chart to measure compression." : market.premiumCompression.toFixed(1) + "% below its 20-bar premium high on " + market.tf + ".";
    var technicalText = constructive + " constructive and " + failures + " pressured lower-timeframe readings.";
    var catalystText = catalyst ? catalyst.title : "No catalyst-keyword headline in the current media feed.";
    return '<div class="dna-watch-head"><strong>Catalyst watch</strong><span class="dna-watch-status' + statusClass + '">' + status + '</span></div>' +
      '<div class="dna-watch-grid">' +
        '<div class="dna-watch-item' + (secOffering ? ' high' : secTop ? ' hit' : '') + '"><strong>SEC filing</strong><span>' + esc(secStateText(filings, secTop)) + (secTop && secTop.filing_url ? ' <a href="' + esc(secSafeUrl(secTop.filing_url)) + '" target="_blank" rel="noopener noreferrer">view</a>' : '') + '</span></div>' +
        '<div class="dna-watch-item' + (highPriority ? ' high' : catalyst ? ' hit' : '') + '"><strong>Catalyst</strong><span>' + esc(catalystText) + '</span></div>' +
        '<div class="dna-watch-item' + (volumeHit ? ' hit' : '') + '"><strong>Volume</strong><span>' + volumeText + '</span></div>' +
        '<div class="dna-watch-item' + (premiumHit ? ' hit' : '') + '"><strong>Premium compression</strong><span>' + premiumText + '</span></div>' +
        '<div class="dna-watch-item' + (technicalHit ? ' hit' : '') + '"><strong>DNA technical response</strong><span>' + technicalText + '</span></div>' +
      '</div><div class="dna-watch-note">Attention mode only—not an entry signal. Premium compression is measured from observed prices and is not attributed to IV or theta without those data.</div>';
  }

  function renderCatalystWatch(sym) {
    Array.prototype.forEach.call(document.querySelectorAll('.dna-catalyst-watch[data-sym="' + sym + '"]'), function (el) {
      el.innerHTML = catalystWatchHtml(sym);
    });
  }

  // --- AMC paper portfolio challenge (P3 UI boundary) -------------------
  // The approved Asset Page remains authoritative for positions and DNA.
  // This layer reads the isolated PAPER_ONLY API when it is mounted. Until
  // the backend reports an authoritative live provider, execution controls
  // stay locked and the figures are explicitly labelled as a live preview.
  function livePortfolioTotals() {
    var out = { value: 0, today: 0, pnl: 0, amc: 0, options: 0, optionPositions: 0 };
    portfolio.forEach(function (p) {
      var v = p.valuation, s = v && v.summary;
      if (!s) return;
      var value = Number(s.total_value || 0);
      out.value += value;
      out.today += Number(s.total_today_pnl || 0);
      out.pnl += Number(s.total_pnl || 0);
      out.options += Number(s.options_value || 0);
      out.optionPositions += Number(s.options_contracts || 0) > 0 ? 1 : 0;
      if (String(p.summary.symbol || "").toUpperCase() === "AMC") out.amc += value;
    });
    return out;
  }

  function paperJson(raw, fallback) {
    if (raw == null) return fallback;
    if (typeof raw === "object") return raw;
    try { return JSON.parse(raw); } catch (_err) { return fallback; }
  }

  function paperMilestones() {
    var defaults = [
      { name: "Silver", value: 6000 }, { name: "Gold", value: 8000 },
      { name: "Premium", value: 10000 }, { name: "Diamond", value: 15000 }
    ];
    var raw = paperChallenge.experiment && paperJson(paperChallenge.experiment.milestones_json, null);
    if (!raw) return defaults;
    if (Array.isArray(raw)) {
      var rows = raw.map(function (x) { return { name: x.name || x.label, value: Number(x.value || x.target) }; }).filter(function (x) { return x.name && isFinite(x.value); });
      return rows.length ? rows.sort(function (a, b) { return a.value - b.value; }) : defaults;
    }
    var mapped = Object.keys(raw).map(function (key) { return { name: key.charAt(0).toUpperCase() + key.slice(1), value: Number(raw[key]) }; }).filter(function (x) { return isFinite(x.value); });
