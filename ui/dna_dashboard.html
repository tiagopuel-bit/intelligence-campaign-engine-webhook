      var currentPrice = x.kind === "option" ? '<em class="dna-held-price">Current ' + fmtMoney(x.data.current_price) + '</em>' : '';
      return '<button type="button" class="dna-held-item pf-row' + (x.key === selectedHolding ? ' selected' : '') + '" data-holding="' + x.key + '"><strong>' + holdingLabel(x) + '</strong><span>' + meta + '</span>' + currentPrice + '<b>' + fmtPct(ret) + '</b></button>';
    }).join("") || '<div class="copy">No open positions on this asset.</div>';
    var closeButton = pick ? '<button class="pf-close" data-pid="' + pick.data.position_id + '" data-legs="' + JSON.stringify(pick.data.leg_ids) + '" data-label="' + holdingLabel(pick) + '">Close</button>' : '<button class="pf-close" disabled>Close</button>';
    var manageQtyAvailable = pick ? (pick.kind === "share" ? pick.data.shares : pick.data.contracts) : 0;
    var manageButton = pick
      ? '<button type="button" class="pf-manage" data-pid="' + pick.data.position_id + '" data-legs="' + JSON.stringify(pick.data.leg_ids) + '"' +
        ' data-label="' + holdingLabel(pick) + '" data-max="' + manageQtyAvailable + '"' +
        ' data-avg="' + fmtMoney(pick.data.avg_cost) + '" data-current="' + fmtMoney(current) + '"' +
        ' data-qty-text="' + qtyText + '">Manage</button>'
      : '<button type="button" class="pf-manage" disabled>Manage</button>';
    var timelineHtml = timeline ? '<div class="dna-timeline"><div class="dna-timeline-head"><strong>Entry → expiration</strong><span>' + timeline.progress + '</span></div><div class="dna-timeline-track"><span class="dna-timeline-fill" style="width:' + timeline.width + '"></span><i class="dna-timeline-dot" style="left:' + timeline.width + '"></i></div><div class="dna-timeline-labels"><span>' + timeline.entry + '</span><span>' + timeline.today + '</span><span>' + timeline.expiry + '</span></div></div>' : '';
    var guidanceBullets = holdingRead.bullets.length ? '<ul class="dna-position-actions">' + holdingRead.bullets.map(function (line) { return '<li>' + line + '</li>'; }).join("") + '</ul>' : '';
    var manager = '<aside class="dna-manager"><div class="label">Position manager</div><div class="dna-manager-title"><strong>' + managerTitle + '</strong><span class="dna-pill green">' + (pick ? 'OPEN' : 'EMPTY') + '</span></div>' +
      '<div class="dna-manager-highlight"><div><div class="dna-k">Current price</div><div class="dna-v">' + fmtMoney(current) + '</div></div><div><div class="dna-k">Market value</div><div class="dna-v">' + fmtMoney(pick ? pick.data.market_value : null) + '</div></div><div><div class="dna-k">Total P&amp;L</div><div class="dna-v return ' + (managerPnl == null || managerPnl >= 0 ? 'pos' : 'neg') + '">' + performanceText(managerPnl, managerPct) + '</div></div><div><div class="dna-k">Return</div><div class="dna-v return ' + (managerPct == null || managerPct >= 0 ? 'pos' : 'neg') + '">' + fmtPct(managerPct) + '</div></div></div>' + timelineHtml +
      '<div class="dna-manager-grid"><div><div class="dna-k">Holding</div><div class="dna-v">' + qtyText + '</div></div><div><div class="dna-k">Entry</div><div class="dna-v">' + entryText + '</div></div><div><div class="dna-k">Breakeven</div><div class="dna-v">' + breakEven + '</div></div><div><div class="dna-k">Held</div><div class="dna-v">' + (heldDays == null ? '—' : heldDays + ' days') + '</div></div><div><div class="dna-k">DTE</div><div class="dna-v">' + (dte == null ? '—' : dte + ' days') + '</div></div></div>' +
      '<div class="dna-risk ' + (primary ? toneClass(primary.tone) : '') + '" data-insight-pid="' + (pick ? pick.data.position_id : '') + '" data-insight-key="' + (pick ? pick.key : '') + '"><strong>' + holdingRead.title + '</strong><br>' + holdingRead.summary + guidanceBullets + '</div>' +
      '<div class="dna-held"><div class="dna-held-title">Positions held</div><div class="dna-held-list">' + heldRows + '</div></div>' +
      '<div class="dna-manager-actions"><button class="open-pos-btn" data-sym="' + sym + '">+ Add position</button>' + closeButton + manageButton + '</div>' +
      '<div class="open-pos-form" style="display:none" data-sym="' + sym + '">' + renderPositionForm(sym) + '</div></aside>' +
      renderManageDialog();

    var chart = '<div class="dna-chart-column"><section class="dna-chart-card"><div class="dna-chart-head"><div><div class="dna-chart-title">' + managerTitle + '</div><div class="dna-chart-sub">Live position chart · entry and DNA reference levels</div></div><span class="dna-pill">Lightweight Charts</span></div><div class="chart-wrap"><div class="chart-toprow"><span class="chart-mode" data-sym="' + sym + '"></span><span class="chart-feats" data-sym="' + sym + '"></span></div><div class="chart-toggles" data-sym="' + sym + '"></div><div class="chart-container" data-sym="' + sym + '"></div><div class="chart-legend" data-sym="' + sym + '">hover a bar for OHLCV</div><div class="chart-status" data-sym="' + sym + '">loading chart…</div></div></section>';
    var signalRows = states.map(function (r) { var tr = tierOf(r.timeframe), ag = age(r.bar_time); return '<tr class="' + (ag.stale ? 'st' : '') + '"><td>' + tfLabel(r.timeframe) + '</td><td>' + (tr ? tr.label : '—') + '</td><td><span class="phase-pill ' + phaseTone(r.phase) + '">' + (r.phase || '—') + '</span></td><td>' + (r.health != null ? r.health + '%' : '—') + '</td><td>' + (r.recent_event || '—') + '</td><td>' + ag.text + '</td></tr>'; }).join("");
    chart += '<section class="dna-panel dna-signals"><div class="dna-signals-head"><div><h3>Timeframe signals</h3><span>Compact evidence under the active chart</span></div></div><details class="raw" open><summary>Show timeframe ladder</summary><div class="raw-body"><div class="scroll"><table><thead><tr><th>TF</th><th>Tier</th><th>Phase</th><th>Health</th><th>Last event</th><th>Updated</th></tr></thead><tbody>' + signalRows + '</tbody></table></div></div></details></section></div>';

    var acts = actionsFor(sym, a);
    var actionHtml;
    if (acts.length) {
      actionHtml = acts.slice(0,3).map(function (x) { return '<div class="action ' + x.level + '"><div class="ic">' + x.ic + '</div><div><div class="a-title">' + x.title + '</div><div class="a-text">' + x.text + '</div></div></div>'; }).join("");
    } else if (holdingRead.bullets.length) {
      var fallbackLevel = primary && primary.tone === "neg" ? "critical" : primary && primary.tone === "warn" ? "watch" : "opportunity";
      var fallbackTitles = ["Position context", "DNA context", "Potential action"];
      actionHtml = holdingRead.bullets.slice(0,3).map(function (line, i) { return '<div class="action ' + fallbackLevel + '"><div class="ic">' + ["•","◎","→"][i] + '</div><div><div class="a-title">' + fallbackTitles[i] + '</div><div class="a-text">' + line + '</div></div></div>'; }).join("");
    } else {
      actionHtml = '<div class="no-actions">Select a holding to see position-specific navigation.</div>';
    }
    var insightTiers = [t.owner,t.confirm,t.timing].filter(function (x) { return x && !x.empty; });
    var insightHtml = insightTiers.map(function (x) { return '<div class="dna-insight-row"><strong>' + x.tier.label + ' · ' + tfLabel(x.lead.timeframe) + '</strong><span>' + x.text + ' · health ' + (x.lead.health != null ? x.lead.health + '%' : '—') + '</span><span class="dna-pill ' + (x.tone === 'neg' ? 'red' : x.tone === 'pos' ? 'green' : '') + '">' + (x.lead.phase || 'WAIT') + '</span></div>'; }).join("");
    var middle = '<div class="dna-middle"><section class="dna-panel"><div class="stage-head"><h2>Action plan</h2><span class="hint">position navigation + catalyst attention</span></div><div class="dna-catalyst-watch" data-sym="' + sym + '">' + catalystWatchHtml(sym) + '</div><div class="actions">' + actionHtml + '</div></section><section class="dna-panel"><div class="stage-head"><h2>Why this matters</h2><span class="hint">current campaign evidence</span></div>' + (insightHtml || '<div class="no-actions">No tier evidence available.</div>') + '</section></div>';

    var progressionTiers = [t.backbone,t.owner,t.confirm,t.timing];
    var progression = '<div class="dna-lower-grid"><section class="dna-panel"><div class="stage-head"><h2>Trade progression</h2><span class="hint">backbone → campaign → confirmation → timing</span></div><div class="dna-progression">' + progressionTiers.map(function (x, i) { var empty = !x || x.empty; var cls = empty ? '' : toneClass(x.tone); return '<div class="dna-stage ' + cls + '"><div class="dna-stage-head"><span class="dna-stage-dot">' + (i+1) + '</span><div><strong>' + ["Backbone","Campaign","Confirmation","Timing"][i] + '</strong><small>' + (empty ? 'no data' : tfLabel(x.lead.timeframe)) + '</small></div></div><div class="dna-stage-state">' + (empty ? 'Waiting' : x.text) + '</div></div>'; }).join("") + '</div></section><section class="dna-panel"><div class="stage-head"><h2>News stream</h2><span class="hint">media sources</span></div><div class="dna-news" data-sym="' + sym + '"><div class="dna-news-empty">Loading media sources…</div></div></section></div>';

    var radar = assets.filter(function (x) { return x.symbol !== sym; }).map(function (x) { var rc = cache[x.symbol], ra = rc && rc.assess; var rs = rc ? rc.states : []; var quick = ["15","60","240","D"].map(function (tf) { var row = rs.filter(function (r) { return String(r.timeframe) === tf; })[0]; return '<span class="dna-radar-tf ' + (row ? toneClass(phaseTone(row.phase)) : 'warn') + '">' + tfLabel(tf) + '</span>'; }).join(""); return '<button type="button" class="dna-radar-item" data-sym="' + x.symbol + '"><span class="dna-radar-top"><strong>' + x.symbol + '</strong><span class="dna-pill ' + (ra && ra.level === 'critical' ? 'red' : ra && ra.level === 'opportunity' ? 'green' : '') + '">' + (ra ? ra.headline : 'Loading') + '</span>' + (ra && ra.warmup ? '<span class="dna-warmup">warming up</span>' : '') + '</span><span class="dna-radar-tfs">' + quick + '</span></button>'; }).join("");
    var radarHtml = '<section class="dna-panel"><div class="stage-head"><h2>Portfolio campaign radar</h2><span class="hint">quick multi-timeframe view across tracked assets</span></div><div class="dna-radar">' + radar + '</div></section>';
    var paperCommand = renderPaperChallenge(sym);

    return '<div class="dna-page">' + radarHtml + decision + portfolioBand + paperCommand + '<div class="dna-workspace">' + manager + chart + '</div>' + middle + progression + '<p class="note"><strong>Evidence boundary:</strong> live positions and DNA state remain distinct from the isolated paper experiment. Every simulated action is labelled PAPER, requires server-side evidence reconstruction, and never reaches a broker.</p></div>';
  }

  // Everything for one expanded asset row: verdict, open-position control,
  // this asset's own holdings (if any), the three-step flow, actions, and
  // the raw table. Replaces what used to be three separate top-level
  // sections (asset header / open-position / detail) scattered around the
  // page -- now it all lives inside that one asset's accordion row.
  function renderAssetBody(sym) {
    var c = cache[sym];
    if (!c) return '<div class="msg">loading ' + sym + '…</div>';
    var a = c.assess, t = a.tiers, states = c.states;

    var verdictHtml = '<p class="verdict ' + a.level + '">This asset <span class="em">' + a.headline + '</span> — ' + a.why + '.</p>' +
      '<div class="verdict-sub">' + states.length + ' timeframe' + (states.length === 1 ? "" : "s") + ' reporting · newest ' + age(states.length ? states[0].bar_time : null).text + '</div>' +
      (a.warmup ? '<div class="warmup-note"><span class="warmup-flag">warming up</span> Campaign (' + tfLabel(a.warmup.ownerTf) + ') is already ' + a.warmup.ownerText + ' while confirmation hasn\'t caught up yet — ' + tfLabel(a.warmup.row.timeframe) + ' just fired <b>' + a.warmup.row.signal_event + '</b>. Not a signal to act on by itself, worth watching for confirmation to follow.</div>' : '');

    var chartHtml = '<div class="chart-wrap">' +
      '<div class="chart-toprow">' +
        '<span class="chart-mode" data-sym="' + sym + '"></span>' +
        '<span class="chart-feats" data-sym="' + sym + '"></span>' +
      '</div>' +
      '<div class="chart-toggles" data-sym="' + sym + '"></div>' +
      '<div class="chart-container" data-sym="' + sym + '"></div>' +
      '<div class="chart-legend" data-sym="' + sym + '">hover a bar for OHLCV</div>' +
      '<div class="chart-status" data-sym="' + sym + '">loading chart…</div></div>';

    var insightHtml = renderPositionInsights(sym);

    var openPosHtml = '<div class="open-wrap">' +
      '<button class="open-pos-btn" data-sym="' + sym + '">+ Open a position in ' + sym + '</button>' +
      '<div class="open-pos-form" style="display:none" data-sym="' + sym + '">' + renderPositionForm(sym) + '</div>' +
      '</div>';

    var holdingsHtml = renderAssetHoldings(sym);

    // Three-step flow: campaign -> opportunity -> right now.
    var steps = [
      { n: "Step 1", h: "Is there a campaign?", q: "Direction + campaign timeframes", parts: [t.backbone, t.owner] },
      { n: "Step 2", h: "Is it actionable?", q: "Confirmation + timing", parts: [t.confirm, t.timing] },
      { n: "Step 3", h: "What's happening now?", q: "Short-term pressure only", parts: [t.micro] }
    ];

    var flowHtml = steps.map(function (s) {
      var lead = s.parts.filter(function (p) { return !p.empty; });
      var rank = { neg: 3, warn: 2, pos: 1, neu: 0, none: -1 };
      var top = lead.length ? lead.reduce(function (m, p) { return rank[p.tone] > rank[m.tone] ? p : m; }) : null;
      var tone = top ? ({ neg: "neg", warn: "warn", pos: "pos", neu: "none" })[top.tone] : "none";
      var answer = top ? (top.tier.label + " is " + top.text) : "No data at this level";
      var chips = s.parts.reduce(function (acc, p) { return acc.concat(p.rows); }, [])
        .sort(function (x, y) { return tfKey(x.timeframe) - tfKey(y.timeframe); })
        .map(function (r) {
          var ag = age(r.bar_time);
          var bf = r.source === "backfill_replay";
          return '<span class="chip ' + phaseTone(r.phase) + (ag.stale ? " stale" : "") + (bf ? " bf" : "") + '"' +
            (bf ? ' title="Reconstructed from historical replay, not a live TradingView alert — advisory, not fidelity-tested."' : "") + '>' +
            tfLabel(r.timeframe) + " · " + plain(r.phase, r.health) + (bf ? ' <span class="bf-tag">R</span>' : "") + '</span>';
        }).join("");
      return '<div class="step ' + tone + '"><div class="step-n">' + s.n + '</div><h3>' + s.h + '</h3><div class="q">' + s.q + '</div>' +
        '<div class="answer">' + answer + '</div><div class="tf-chips">' + (chips || '<span class="chip">nothing reporting</span>') + '</div></div>';
    }).join("");

    var acts = actionsFor(sym, a);
    var actHtml = acts.length
      ? acts.map(function (x) {
          return '<div class="action ' + x.level + '"><div class="ic">' + x.ic + '</div><div>' +
            '<div class="a-title">' + x.title + '</div><div class="a-text">' + x.text + '</div>' +
            (x.why ? '<div class="a-why">' + x.why + '</div>' : "") + '</div></div>';
        }).join("")
      : '<div class="no-actions">Nothing actionable on ' + sym + ' right now. The engine has readings, but none of them cross a threshold worth interrupting you for.</div>';

    var rows = states.slice().sort(function (x, y) { return tfKey(x.timeframe) - tfKey(y.timeframe); }).map(function (r) {
      var ag = age(r.bar_time), tr = tierOf(r.timeframe);
      var bf = r.source === "backfill_replay";
      return '<tr class="' + (ag.stale ? "st" : "") + '"><td class="tabular" style="font-family:var(--font-display);font-weight:600">' + tfLabel(r.timeframe) + '</td>' +
        '<td><span class="tier-tag">' + (tr ? tr.label : "—") + '</span></td>' +
        '<td>' + (r.phase ? '<span class="phase-pill ' + phaseTone(r.phase) + '">' + r.phase + '</span>' : "—") + '</td>' +
        '<td class="tabular">' + (r.health != null ? r.health + "%" : "—") + '</td>' +
        '<td class="tabular">' + (r.confidence != null ? r.confidence + "%" : "—") + '</td>' +
        '<td>' + (r.recent_event || "—") + '</td>' +
        '<td class="tabular">' + ag.text + '</td>' +
        '<td>' + (bf ? '<span class="src-badge bf" title="Reconstructed from historical replay, not fidelity-tested">reconstructed</span>' : '<span class="src-badge live">live</span>') + '</td></tr>';
    }).join("");

    return verdictHtml + chartHtml + openPosHtml + holdingsHtml +
      '<div class="stage-head"><h2>The flow</h2><span class="hint">campaign first, short-term last</span></div>' +
      '<div class="flow">' + flowHtml + '</div>' +
      insightHtml +
      '<div class="stage-head"><h2>What to do</h2><span class="hint">only what crosses a threshold</span></div>' +
      '<div class="actions">' + actHtml + '</div>' +
      '<details class="raw" open><summary>Every timeframe, raw</summary><div class="raw-body"><div class="scroll"><table>' +
      '<thead><tr><th>TF</th><th>Tier</th><th>Phase</th><th>Health</th><th>Conf</th><th>Last event</th><th>Updated</th><th>Source</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div></details>' +
      '<p class="note"><strong>How to read this:</strong> every reading above is real, straight from the alerts table. The grouping into Direction / Campaign / Confirmation / Timing / Right&nbsp;now follows the tier model in the coordinator spec, and the wording is a fixed rule-based translation of those readings — not a prediction, and not a coordinator verdict (the coordinator isn\'t wired to live data yet). Positions are a manual log; nothing here opens or closes anything automatically.</p>';
  }

  // --- Chart: real OHLC closes for the expanded asset, with the position's
  // actual entry price and DNA's own Trade Box entry/stop/target drawn as
  // reference lines when they exist. Canvas must already be in the DOM
  // (paint() calls this after app.innerHTML is set), and bars come from the
  // /ohlc endpoint DeepSeek already shipped -- OHLC ladder uses 5/15/60/1D
  // style labels, not the coordinator tier keys, so map to the shortest
  // timeframe this asset actually has data for.
  var ohlcCache = {};
  var OHLC_TF_MAP = { "3": "3m", "5": "5m", "15": "15m", "30": "30m", "60": "1H", "120": "2H", "180": "3H", "240": "4H", "D": "D" };
  var OPTION_TFS = ["5m", "15m", "30m", "1H", "4H", "D"];
  var chartModeOverride = {};
  var chartFeatOverride = {};
  var chartDrawSeq = 0;

  var chartCtl = {
    chart: null, candleSeries: null, volSeries: null, markersPlugin: null, resizeObserver: null,
    sym: null, mode: null, tf: null, ticker: null
  };

  function optionTickerJs(sym, type, strike, exp) {
    var d = String(exp).replace(/-/g, "");
    var ct = type === "CALL" ? "C" : "P";
    var s = String(Math.round(Number(strike) * 1000));
    while (s.length < 8) s = "0" + s;
    return "O:" + sym + d.slice(2, 4) + d.slice(4, 6) + d.slice(6, 8) + ct + s;
  }

  function chartColors() {
    var st = getComputedStyle(document.documentElement);
    var get = function (k, d) { var v = st.getPropertyValue(k).trim(); return v || d; };
    return {
      bg: get("--surface", "#101613"), fg: get("--text", "#e7ede9"),
      grid: get("--line", "#1e2925"), up: get("--positive", "#6fcf7c"), down: get("--critical", "#e2685c"),
      accent: get("--accent", "#4fe3c4"), warn: get("--warning", "#e7b24c"),
    };
  }

  function destroyChart() {
    if (chartCtl.resizeObserver) { chartCtl.resizeObserver.disconnect(); chartCtl.resizeObserver = null; }
    if (chartCtl.markersPlugin && chartCtl.markersPlugin.detach) { try { chartCtl.markersPlugin.detach(); } catch (e) {} }
    chartCtl.markersPlugin = null;
    if (chartCtl.chart) { chartCtl.chart.remove(); chartCtl.chart = null; }
    chartCtl.candleSeries = null; chartCtl.volSeries = null;
  }

  function makeChart(container, legendEl) {
    destroyChart();
    var c = chartColors();
    var chart = LightweightCharts.createChart(container, {
      layout: { background: { color: c.bg }, textColor: c.fg },
      grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
      rightPriceScale: { borderColor: c.grid },
      timeScale: { borderColor: c.grid, timeVisible: true, secondsVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    var cs = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: c.up, downColor: c.down, borderVisible: false, wickUpColor: c.up, wickDownColor: c.down,
    });
    var vs = chart.addSeries(LightweightCharts.HistogramSeries, { priceFormat: { type: "volume" }, priceScaleId: "" });
    vs.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    chartCtl.chart = chart; chartCtl.candleSeries = cs; chartCtl.volSeries = vs;
    chart.subscribeCrosshairMove(function (param) {
      if (!param || !param.time || !param.seriesData.has(cs)) { legendEl.textContent = "hover a bar for OHLCV"; return; }
      var b = param.seriesData.get(cs);
      var v = param.seriesData.has(vs) ? param.seriesData.get(vs).value : null;
      legendEl.textContent = "O " + b.open.toFixed(2) + " · H " + b.high.toFixed(2) + " · L " + b.low.toFixed(2) +
        " · C " + b.close.toFixed(2) + (v != null ? " · V " + v : "");
    });
    chartCtl.resizeObserver = new ResizeObserver(function () {
      chart.applyOptions({ width: container.clientWidth || 600, height: 300 });
    });
    chartCtl.resizeObserver.observe(container);
  }

  function chartTarget(sym) {
    var h = deriveHoldings();
    var shares = h.shares.filter(function (s) { return s.symbol === sym; });
    var strategies = h.strategies.filter(function (o) { return o.symbol === sym; });
    var all = shares.map(function (s) { return { kind: "share", data: s, key: holdingKey(s.leg_ids) }; })
      .concat(strategies.map(function (o) { return { kind: "option", data: o, key: holdingKey(o.leg_ids) }; }));
    var pick = all.length === 1 ? all[0] : all.filter(function (x) { return x.key === selectedHolding; })[0];
    return { all: all, pick: pick, shares: shares, strategies: strategies };
  }

  function loadChartBars(sym, mode, ticker, tf) {
    var key = (mode === "option" ? ticker : sym) + ":" + tf;
    if (ohlcCache[key]) return Promise.resolve(ohlcCache[key]);
    var base = baseInput.value.trim().replace(/\/$/, "");
    var url = mode === "option"
      ? base + "/options/ohlc/" + encodeURIComponent(ticker) + "/" + encodeURIComponent(tf)
      : base + "/ohlc/" + encodeURIComponent(sym) + "/" + encodeURIComponent(tf);
    return fetch(url, { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (d) { if (d && d.bars) ohlcCache[key] = d; return d; });
  }

  // Live underlying close (near-real-time webhook close) for a symbol, or null
  // when no open valuation supplies one. Used to overlay the current price on
  // the chart so its reference price matches the header instead of lagging the
  // Massive daily close.
  function liveUnderlyingCurrent(sym) {
    var current = null;
    portfolio.some(function (p) {
      if (p.summary.symbol === sym && p.valuation && p.valuation.underlying &&
          p.valuation.underlying.current != null) {
        current = p.valuation.underlying.current;
        return true;
      }
      return false;
    });
    if (current != null) return current;
    var c2 = cache[sym];
    var states = (c2 && c2.states) || [];
    var latest = states.slice().sort(function (a, b) { return tfKey(a.timeframe) - tfKey(b.timeframe); })
      .filter(function (s) { return s.close != null; })[0];
    return latest ? latest.close : null;
  }

  function drawChart(sym) {
    var drawId = ++chartDrawSeq;
    var container = document.querySelector('.chart-container[data-sym="' + sym + '"]');
    var statusEl2 = document.querySelector('.chart-status[data-sym="' + sym + '"]');
    var legendEl = document.querySelector('.chart-legend[data-sym="' + sym + '"]');
    var togglesEl = document.querySelector('.chart-toggles[data-sym="' + sym + '"]');
    var modeEl = document.querySelector('.chart-mode[data-sym="' + sym + '"]');
    var featsEl = document.querySelector('.chart-feats[data-sym="' + sym + '"]');
    if (!container) return;

    var tgt = chartTarget(sym);
    var target = tgt.pick;
    var isOptionTarget = target && target.kind === "option";
    var mode = chartModeOverride[sym] || (isOptionTarget ? "option" : "underlying");
    var optionTarget = (mode === "option") && (isOptionTarget ? target : (tgt.strategies[0] ? { kind: "option", data: tgt.strategies[0], key: holdingKey(tgt.strategies[0].leg_ids) } : null));
    var ticker = (mode === "option" && optionTarget) ? optionTickerJs(sym, optionTarget.data.contract.type, optionTarget.data.contract.strike, optionTarget.data.contract.expiration) : null;
    if (mode === "option" && !ticker) { mode = "underlying"; chartModeOverride[sym] = "underlying"; }

    if (modeEl) {
      modeEl.innerHTML =
        '<button class="cm-btn' + (mode === "underlying" ? " on" : "") + '" data-mode="underlying">Underlying</button>' +
        '<button class="cm-btn' + (mode === "option" ? " on" : "") + '" data-mode="option"' + (tgt.strategies.length ? "" : ' disabled title="no option holding to view"') + '>Option</button>';
      Array.prototype.forEach.call(modeEl.querySelectorAll(".cm-btn"), function (b) {
        if (b.disabled) return;
        b.addEventListener("click", function () {
          chartModeOverride[sym] = b.dataset.mode;
          drawChart(sym);
        });
      });
    }

    var feats = chartFeatOverride[sym] || { volume: true, position: true, dna: true, tradebox: true };
    if (featsEl) {
      featsEl.innerHTML =
        '<label class="cf"><input type="checkbox" data-feat="volume"' + (feats.volume ? " checked" : "") + '> Volume</label>' +
        '<label class="cf"><input type="checkbox" data-feat="position"' + (feats.position ? " checked" : "") + '> Position</label>' +
        '<label class="cf"><input type="checkbox" data-feat="dna"' + (feats.dna ? " checked" : "") + '> DNA</label>' +
        '<label class="cf"><input type="checkbox" data-feat="tradebox"' + (feats.tradebox ? " checked" : "") + '> Trade Box</label>';
      Array.prototype.forEach.call(featsEl.querySelectorAll("input[data-feat]"), function (cb) {
        cb.addEventListener("change", function () {
          chartFeatOverride[sym] = chartFeatOverride[sym] || { volume: true, position: true, dna: true, tradebox: true };
          chartFeatOverride[sym][cb.dataset.feat] = cb.checked;
          drawChart(sym);
        });
      });
    }

    var candidates;
    if (mode === "option") {
      candidates = OPTION_TFS;
    } else {
      var c = cache[sym];
      var states = (c && c.states) || [];
      var sorted = states.slice().sort(function (a, b) { return tfKey(a.timeframe) - tfKey(b.timeframe); });
      candidates = sorted.map(function (r) { return OHLC_TF_MAP[String(r.timeframe)]; }).filter(Boolean);
      candidates = candidates.filter(function (v, i) { return candidates.indexOf(v) === i; });
      if (!candidates.length) candidates = ["15m"];
    }

    if (togglesEl) {
      togglesEl.innerHTML = candidates.map(function (tf) {
        var on = (chartTfOverride[sym] || "") === tf;
        return '<button type="button" class="tf-btn' + (on ? " on" : "") + '" data-tf="' + tf + '">' + tf + '</button>';
      }).join("");
      Array.prototype.forEach.call(togglesEl.querySelectorAll(".tf-btn"), function (btn) {
        btn.addEventListener("click", function () {
          chartTfOverride[sym] = (chartTfOverride[sym] === btn.dataset.tf) ? null : btn.dataset.tf;
          drawChart(sym);
        });
      });
    }

    var entryMs = target ? parseIsoMs(target.data.first_entry) : null;

    function autoTry(i) {
      if (drawId !== chartDrawSeq) return;
      if (i >= candidates.length) { if (statusEl2) statusEl2.textContent = "No chart data available for " + sym + "."; return; }
      loadChartBars(sym, mode, ticker, candidates[i]).then(function (d) {
        if (drawId !== chartDrawSeq) return;
        if (!d || !d.bars || !d.bars.length) return autoTry(i + 1);
        if (entryMs != null && d.bars[0].t > entryMs && i < candidates.length - 1) return autoTry(i + 1);
        renderChart(d, candidates[i]);
      });
    }

    var manualTf = chartTfOverride[sym];
    if (manualTf && candidates.indexOf(manualTf) !== -1) {
      loadChartBars(sym, mode, ticker, manualTf).then(function (d) {
        if (drawId !== chartDrawSeq) return;
        if (d && d.bars && d.bars.length) return renderChart(d, manualTf);
        autoTry(0);
      });
    } else {
      autoTry(0);
    }

    function renderChart(d, tfLbl) {
      if (drawId !== chartDrawSeq) return;
      var container2 = document.querySelector('.chart-container[data-sym="' + sym + '"]');
      if (!container2) return;
      makeChart(container2, legendEl);
      var c = chartColors();
      var bars = d.bars;
      var feats2 = chartFeatOverride[sym] || { volume: true, position: true, dna: true, tradebox: true };

      chartCtl.candleSeries.setData(bars.map(function (b) { return { time: b.t / 1000, open: b.o, high: b.h, low: b.l, close: b.c }; }));
      if (feats2.volume) {
        chartCtl.volSeries.setData(bars.map(function (b) { return { time: b.t / 1000, value: b.v, color: b.c >= b.o ? c.up + "88" : c.down + "88" }; }));
      }

      var refs = [], markers = [], firstT = bars[0].t / 1000, lastT = bars[bars.length - 1].t / 1000;
      var watchBars = bars.slice(-21), watchLast = watchBars[watchBars.length - 1];
      var priorBars = watchBars.slice(0, -1), priorVolume = priorBars.reduce(function (sum, b) { return sum + (Number(b.v) || 0); }, 0);
      var avgVolume = priorBars.length ? priorVolume / priorBars.length : null;
      var premiumHigh = mode === "option" ? watchBars.reduce(function (high, b) { return Math.max(high, Number(b.c) || 0); }, 0) : null;
      marketWatchBySymbol[sym] = {
        tf: tfLbl,
        mode: mode,
        volumeRatio: watchLast && avgVolume ? (Number(watchLast.v) || 0) / avgVolume : null,
        premiumCompression: mode === "option" && watchLast && premiumHigh ? Math.max(0, (premiumHigh - Number(watchLast.c)) / premiumHigh * 100) : null
      };
      renderCatalystWatch(sym);

      if (mode === "option" && optionTarget) {
        var o = optionTarget.data;
        if (feats2.position && o.avg_cost != null) {
          refs.push({ price: o.avg_cost, color: c.accent, style: LightweightCharts.LineStyle.Solid, title: "entry " + Number(o.avg_cost).toFixed(3) });
          var t = parseIsoMs(o.first_entry);
          if (t != null && t / 1000 >= firstT && t / 1000 <= lastT) {
            markers.push({ time: t / 1000, position: "belowBar", color: c.accent, shape: "arrowUp", text: "Entry " + Number(o.avg_cost).toFixed(3) });
          }
        }
        var lastB = bars[bars.length - 1];
        refs.push({ price: lastB.c, color: c.accent, style: LightweightCharts.LineStyle.Dashed, title: "premium " + lastB.c.toFixed(2) });
      } else {
        if (feats2.position && target && target.kind === "share") {
          var s = target.data;
          if (s.avg_cost != null) {
            refs.push({ price: s.avg_cost, color: c.accent, style: LightweightCharts.LineStyle.Solid, title: "avg " + Number(s.avg_cost).toFixed(2) });
            var t = parseIsoMs(s.first_entry);
            if (t != null && t / 1000 >= firstT && t / 1000 <= lastT) {
              markers.push({ time: t / 1000, position: "belowBar", color: c.accent, shape: "arrowUp", text: "In " + Number(s.avg_cost).toFixed(2) });
            }
          }
        }
        if (feats2.dna || feats2.tradebox) {
          var c2 = cache[sym];
          var states2 = (c2 && c2.states) || [];
          var activeRow = states2.filter(function (r) { return r.active_trade; })[0];
          if (activeRow) {
            if (feats2.dna) {
              if (activeRow.active_entry != null) refs.push({ price: activeRow.active_entry, color: c.accent, style: LightweightCharts.LineStyle.Solid, title: "DNA entry" });
              if (activeRow.active_stop != null) refs.push({ price: activeRow.active_stop, color: c.down, style: LightweightCharts.LineStyle.Solid, title: "DNA stop" });
              if (activeRow.active_target != null) refs.push({ price: activeRow.active_target, color: c.up, style: LightweightCharts.LineStyle.Solid, title: "DNA target" });
            }
          }
        }
        var lastB = bars[bars.length - 1];
        refs.push({ price: lastB.c, color: c.accent, style: LightweightCharts.LineStyle.Dashed, title: "close " + lastB.c.toFixed(2) });
        var liveCur = liveUnderlyingCurrent(sym);
        if (liveCur != null && Math.abs(Number(liveCur) - Number(lastB.c)) > 1e-9) {
          refs.push({ price: liveCur, color: c.accent, style: LightweightCharts.LineStyle.Solid, title: "current " + Number(liveCur).toFixed(2) });
        }
      }

      if (markers.length) {
        chartCtl.markersPlugin = LightweightCharts.createSeriesMarkers(chartCtl.candleSeries, markers);
      }
      refs.forEach(function (r) {
        chartCtl.candleSeries.createPriceLine({ price: r.price, color: r.color, lineWidth: 1, lineStyle: r.style, axisLabelVisible: true, title: r.title });
      });

      chartCtl.chart.timeScale().fitContent();

      var label = mode === "option" ? ticker : sym;
      var statusNote = "";
      if (mode === "underlying") {
        var liveCur2 = liveUnderlyingCurrent(sym);
        var lastC = bars.length ? bars[bars.length - 1].c : null;
        if (liveCur2 != null && lastC != null && Math.abs(Number(liveCur2) - Number(lastC)) > 1e-9) {
          statusNote = " · live $" + Number(liveCur2).toFixed(2) + " · candles delayed ~1d (Massive)";
        }
      }
      if (statusEl2) statusEl2.textContent = label + " · " + tfLbl + " · " + bars.length + " bars · source: massive" + (d.cached ? " (cached)" : "") + statusNote;
    }
  }

  // Fill in each option holding's "worth a look" roll candidate from the
  // real chain, once per symbol (not once per contract). Only ever shows a
  // real chain contract or nothing -- never a made-up strike.
  function populateChainSuggestions() {
    var slots = document.querySelectorAll(".chain-suggest");
    var bySymbol = {};
    Array.prototype.forEach.call(slots, function (el) {
      var sym = el.dataset.sym;
      (bySymbol[sym] = bySymbol[sym] || []).push(el);
    });
    Object.keys(bySymbol).forEach(function (sym) {
      loadChain(sym).then(function (chain) {
        bySymbol[sym].forEach(function (el) {
          var cand = suggestRollCandidate(chain, Number(el.dataset.strike), el.dataset.exp, el.dataset.type, el.dataset.tone);
          if (!cand) return;
          el.innerHTML = '<div class="a-text chain-line">Worth a look: <strong>$' + cand.strike + ' ' + cand.contract_type +
            ' · ' + fmtExpiry(cand.expiration) + '</strong> — from the real chain, DNA-agreeing direction. Strike/expiry only, no live pricing on the free plan to size it precisely.</div>';
        });
      });
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function safeNewsUrl(raw) {
    try {
      var parsed = new URL(String(raw || ""));
      return parsed.protocol === "https:" || parsed.protocol === "http:" ? parsed.href : "#";
    } catch (_err) {
      return "#";
    }
  }

  // Pull the aggregated headline feed for every open asset's News stream box.
  function loadNewsStream() {
    var base = baseInput.value.trim().replace(/\/$/, "");
    Array.prototype.forEach.call(document.querySelectorAll(".dna-news[data-sym]"), function (el) {
      var sym = el.dataset.sym;
      fetch(base + "/news/" + encodeURIComponent(sym), { headers: authHeaders() })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .catch(function (err) { return { news: [], error: err && err.message ? err.message : "unavailable" }; })
        .then(function (d) {
          var items = d.news || [];
          newsBySymbol[sym] = items;
          renderCatalystWatch(sym);
          if (!items.length) {
            el.innerHTML = '<div class="dna-news-empty">' + (d.error ? 'News stream unavailable for ' + esc(sym) + '. The media endpoint is not live yet.' : 'No media items found for ' + esc(sym) + '.') + '</div>';
            return;
          }
          el.innerHTML = '<div class="dna-news-list">' + items.slice(0, 8).map(function (n) {
            var src = n.source === "yahoo" ? "Yahoo" : "Google";
            return '<a class="dna-news-item" href="' + esc(safeNewsUrl(n.url)) + '" target="_blank" rel="noopener noreferrer">' +
              '<span class="dna-news-title">' + esc(n.title || "Untitled") + '<span class="dna-news-src">' + esc(src) + '</span></span>' +
              '<span class="dna-news-meta">' + esc(n.publisher || "media") + ' · ' + age(n.published).text + '</span></a>';
          }).join("") + '</div><div class="dna-news-foot">' + items.length + ' items · Yahoo Finance + Google News</div>';
        });
    });
  }

  function loadPionex() {
    var el = document.querySelector('[data-role="pionex"]');
    if (!el) return;
    var base = baseInput.value.trim().replace(/\/$/, "");
    fetch(base + "/portfolio/pionex", { headers: authHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function () { return null; })
      .then(function (d) {
        var body = el.querySelector(".pionex-body");
        if (!body) return;
        if (!d || !Array.isArray(d.balances)) {
          body.innerHTML = '<div class="dna-news-empty">Pionex spot wallet unavailable.</div>';
          return;
        }
        var rows = d.balances.slice(0, 12).map(function (b) {
          var total = Number(b.total);
          var qty = isFinite(total) ? total.toLocaleString(undefined, { maximumFractionDigits: 6 }) : "—";
          var value = b.value_usd == null ? "—" : fmtMoney(Number(b.value_usd));
          return '<div class="pionex-row"><span class="pionex-coin">' + esc(b.coin) + '</span>' +
            '<span class="pionex-qty tabular">' + qty + '</span>' +
            '<span class="pionex-val tabular">' + value + '</span></div>';
        }).join("");
        var totalValue = Number(d.total_value_usd);
        var unpriced = Array.isArray(d.unpriced_coins) && d.unpriced_coins.length
          ? '<span class="pionex-unpriced"> · unpriced: ' + d.unpriced_coins.map(esc).join(", ") + '</span>' : '';
        body.innerHTML = '<div class="pionex-total"><span>Spot wallet total</span><b>' +
          (isFinite(totalValue) ? fmtMoney(totalValue) : "—") + '</b></div>' +
          '<div class="pionex-list">' + (rows || '<div class="dna-news-empty">No spot balances reported.</div>') + '</div>' +
          '<div class="pionex-note">Trading-account balances only; Pionex bot and earn balances are not exposed by this API.' + unpriced + '</div>';
      });
  }

  function paint() {
    app.innerHTML = selected ? renderApprovedAsset(selected) : renderAssetList();
    wirePortfolio();
    wireManageDialog();
    Array.prototype.forEach.call(document.querySelectorAll(".dna-radar-item"), function (b) {
      b.addEventListener("click", function () {
        var sym = b.dataset.sym;
        selected = sym;
        selectedHolding = null;
        loadSymbol(selected, false).then(function () { paint(); });
      });
    });
    wirePosition();
    if (selected) drawChart(selected);
    populateChainSuggestions();
    populatePositionInsights();
    loadNewsStream();
    loadFilings();
    loadPionex();
    wirePaperControls();
    loadPaperChallenge(false);
  }

  // Pull SEC filing watch state for every open asset's Catalyst Watch box.
  // The endpoint is read-only (SQLite); it never triggers a poll.
  function loadFilings() {
    var base = baseInput.value.trim().replace(/\/$/, "");
    Array.prototype.forEach.call(document.querySelectorAll(".dna-catalyst-watch[data-sym]"), function (el) {
      var sym = el.dataset.sym;
      fetch(base + "/filings/" + encodeURIComponent(sym), { headers: authHeaders() })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .catch(function (err) { return { configured: false, error: err && err.message ? err.message : "unavailable" }; })
        .then(function (d) {
          filingsBySymbol[sym] = d;
          renderCatalystWatch(sym);
        });
    });
  }

  function populatePositionInsights() {
    Array.prototype.forEach.call(document.querySelectorAll(".dna-risk[data-insight-pid]"), function (el) {
      var pid = el.getAttribute("data-insight-pid");
      if (!pid) return;
      var key = el.getAttribute("data-insight-key") || "";
      loadInsight(pid).then(function (d) {
        if (!d || !d.holdings) return;
        var match = null;
        for (var i = 0; i < d.holdings.length; i++) {
          if ((d.holdings[i].leg_ids || []).join(",") === key) { match = d.holdings[i]; break; }
        }
        if (!match) return;
        var ins = match.insight;
        if (!ins || ins.confidence === "no-basis") return;
        var evidence = (ins.evidence || []).join(" · ");
        var html = '<strong>' + esc(ins.status_label || ins.navigation_intent || "") + '</strong><br>' + esc(ins.conclusion || "");
        if (ins.decision_change) html += '<br><span class="copy">' + esc(ins.decision_change) + '</span>';
        if (evidence) html += '<br><span class="copy">' + esc(evidence) + '</span>';
        el.innerHTML = html;
      });
    });
  }

  function loadSymbol(sym, repaint) {
    var base = baseInput.value.trim().replace(/\/$/, "");
    if (cache[sym]) { if (repaint) paint(); return Promise.resolve(); }
    return fetch(base + "/state_all/" + encodeURIComponent(sym), { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : { states: [] }; })
      .catch(function () { return { states: [] }; })
      .then(function (d) {
        var states = (d.states || []).map(function (s) {
          s.timeframe = canonTf(s.timeframe);
          return s;
        });
        cache[sym] = { states: states, assess: assess(states) };
        if (repaint) paint();
      });
  }

  function load() {
    var base = baseInput.value.trim().replace(/\/$/, "");
    if (!base) { statusEl.textContent = "enter a URL"; return; }
    localStorage.setItem("dna_api_base", base);
    localStorage.setItem("dna_api_token", tokenInput.value.trim());
    statusEl.textContent = "loading…";
    cache = {};
    insightCache = {};
    app.innerHTML = '<div class="msg">Loading…</div>';

    fetch(base + "/assets", { headers: authHeaders() })
      .then(function (r) {
        if (r.status === 401) throw new Error("Unauthorized — check the token.");
        if (!r.ok) throw new Error("GET /assets returned HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        assets = d.assets || [];
        if (!assets.length) { app.innerHTML = '<div class="msg">No assets recorded yet.</div>'; statusEl.textContent = "0 assets"; return; }
        statusEl.textContent = assets.length + " assets";
        return Promise.all(assets.map(function (a) { return loadSymbol(a.symbol, false); })).then(function () {
          var ranked = assets.slice().sort(function (x, y) {
            return LEVEL_ORDER[cache[x.symbol].assess.level] - LEVEL_ORDER[cache[y.symbol].assess.level];
          });
          if (!selected || !cache[selected]) {
            selected = cache.AMC ? "AMC" : ranked[0].symbol;
          }
          return Promise.all([loadPortfolio(), loadClosedPositions()]);
        }).then(function () { paint(); });
      })
      .catch(function (e) {
        app.innerHTML = '<div class="msg err">' + e.message + '</div>';
        statusEl.textContent = "error";
      });
  }

  $('[data-role="load"]').addEventListener("click", load);
  baseInput.addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  tokenInput.addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  load();
})();
</script>
</body>
